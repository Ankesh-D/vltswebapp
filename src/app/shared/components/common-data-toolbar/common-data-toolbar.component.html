<div class="common-data-toolbar" [class.common-data-toolbar--vehicle]="variant === 'vehicle'"
  [class.common-data-toolbar--device]="variant === 'device'">
  @if (showSearch || showReload || showExcel || showPdf) {
    <div class="common-data-toolbar__search">
      @if (showSearch) {
        <div class="common-data-toolbar__search-control">
          <input id="common-data-search" type="search" [placeholder]="searchPlaceholder"
            [attr.aria-label]="searchLabel" [ngModel]="searchText" (ngModelChange)="searchTextChange.emit($event)"
            (keyup.enter)="search.emit()" maxlength="50" autocomplete="off">
          <button type="button" aria-label="Search" title="Search" (click)="search.emit()">
            <i class="fa fa-search" aria-hidden="true"></i>
          </button>
        </div>
      }
      @if (showReload) {
        <button type="button" class="common-data-toolbar__reload" (click)="reload.emit()" [disabled]="loading"
          [attr.aria-label]="loading ? 'Reloading data' : 'Reload data'" [title]="loading ? 'Reloading…' : 'Reload'">
          <i class="fa fa-refresh" [class.fa-spin]="loading" aria-hidden="true"></i>
        </button>
      }

      @if (showExcel || showPdf) {
        <div class="common-data-toolbar__exports" role="group" aria-label="Export data">
          @if (showExcel) {
            <button type="button" class="common-data-toolbar__export common-data-toolbar__export--excel"
              (click)="excelExport.emit()" [disabled]="loading || exportLoading" aria-label="Export Excel" title="Export Excel">
              <i class="fa fa-file-excel-o" aria-hidden="true"></i><span>Excel</span>
            </button>
          }
          @if (showPdf) {
            <button type="button" class="common-data-toolbar__export common-data-toolbar__export--pdf"
              (click)="pdfExport.emit()" [disabled]="loading" aria-label="Export PDF" title="Export PDF">
              <i class="fa fa-file-pdf-o" aria-hidden="true"></i><span>PDF</span>
            </button>
          }
        </div>
      }
    </div>
  }

  <ng-content select="[toolbarBeforePageSize]"></ng-content>

  @if (showPageSize) {
    <label class="common-data-toolbar__page-size">
      <select [ngModel]="selectedPageSize" (ngModelChange)="onPageSizeChange($event)" aria-label="Items per page">
        @for (option of pageSizeOptions; track option) {
          <option [ngValue]="variant === 'vehicle' && option === totalRecords ? 'All' : option">
            {{ variant === 'vehicle' && option === totalRecords ? 'All' : option }}
          </option>
        }
      </select>
    </label>
  }
  @if (showTotal) {
    <span class="common-data-toolbar__total">
      {{ totalLabel }}: {{ displayedCount }} {{ countSeparator }} {{ totalRecords }}
    </span>
  }

  <ng-content></ng-content>
</div>
