<div class="content-i" style="padding: 10px 10px; background: #ffffff; min-height: 100vh;">
  <div class="content-box">
    <div class="element-wrapper">
      <div class="element-box">
        <div class="page-header-row">
          <div class="pagetitlestyle">Send Command Details</div>
          <button type="button" class="add-new-btn" [routerLink]="'/command/entry'">
            <i class="fa fa-plus" aria-hidden="true"></i>
            <span>Send Command</span>
          </button>
        </div>

        <app-common-data-toolbar
          variant="device"
          searchLabel="Search commands"
          searchPlaceholder="Type here..."
          [searchText]="detailsRequest.param1"
          (searchTextChange)="detailsRequest.param1 = $event"
          (search)="getSearchDetails()"
          (reload)="reloadData()"
          [loading]="loading"
          [pageSize]="pageSize"
          [pageSizeOptions]="pageSizeOptions"
          [displayedCount]="pageCount"
          [totalRecords]="totalCount"
          [showFilters]="false"
          [showExcel]="false"
          [showPdf]="false"
          (pageSizeChange)="onPageSizeChange($event)"
          pageSizeLabel="Show Rows"
          totalLabel="Total Records"
          countSeparator="of">
        </app-common-data-toolbar>

        <app-data-table
          [columns]="tableColumns"
          [rows]="detailsData"
          [loading]="loading"
          tableClass="table table-striped app-table"
          tableId="devicetable"
          emptyMessage="No Record Found">
        </app-data-table>

        <app-common-pagination
          [totalRecords]="totalCount"
          [page]="pageNo"
          [pageSize]="pageSize"
          [disabled]="loading"
          (pageChange)="changePage($event)">
        </app-common-pagination>
      </div>
    </div>
  </div>
</div>

@if (showDeleteModal) {
  <div class="modal fade show" style="display:block; background:rgba(0,0,0,0.5);">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title">Delete Command</h5>
          <button type="button" class="close" (click)="showDeleteModal=false">
            <span>&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <table class="table table-bordered table-sm">
            <tr>
              <th>Vendor Name</th>
              <td>{{selectedCommand?.param8}}</td>
            </tr>
            <tr>
              <th>Device Model</th>
              <td>{{selectedCommand?.param9}}</td>
            </tr>
            <tr>
              <th>Command Name</th>
              <td>{{selectedCommand?.param5}}</td>
            </tr>
            <tr>
              <th>Command Sent</th>
              <td>{{selectedCommand?.param6}}</td>
            </tr>
            <tr>
              <th>Command Executed Date</th>
              <td>{{selectedCommand?.param7}}</td>
            </tr>
          </table>
          <div class="form-group">
            <label>
              Remark <span class="text-danger">*</span>
            </label>
            <textarea
              class="form-control"
              rows="3"
              [(ngModel)]="deleteRemark"
              placeholder="Enter Remark">
            </textarea>
          </div>
        </div>
        <div style="padding: 15px; display: flex; justify-content: center; gap: 10px;">
          <button class="btn btn-sm btn-secondary" (click)="showDeleteModal=false">
            Cancel
          </button>
          <button type="button" class="btn-delete" (click)="deleteCommand()">
            <i class="fa fa-trash" aria-hidden="true"></i> Delete
          </button>
        </div>
      </div>
    </div>
  </div>
}
