<div class="content-i">
  <div class="content-box">
    <div class="element-box">

      <!-- PAGE TITLE -->
      <div class="pagetitlestyle">
        <span>Geofence Entry Exit </span>
      </div>

      <!-- MAIN LAYOUT -->
      <div class="overspeed-layout">

        <!-- LEFT FILTER PANEL -->
        <div class="left-filter-panel entrypagediv">

          <!-- FILTER BY -->
          <div class="form-group filterby-row">
            <label  style="margin: 2px;" class="control-label">Filter By :</label>

            <div class="filterby-options">
              <label class="radio-item">
                <input type="radio" name="filter"
                       (change)="onFilterByChange('Vendor')" checked>
                Vendor
              </label>

              <label class="radio-item">
                <input type="radio" name="filter"
                       (change)="onFilterByChange('RTO')">
                RTO
              </label>
            </div>
          </div>

          <!-- VENDOR -->
         <!-- VENDOR -->
<div class="form-group"  *ngIf="filterBy === 'Vendor'">
            <label class="control-label">Select Vendor <span style="color:red">*</span></label>
            <select class="searchable full-control"
                    [(ngModel)]="selectedVendor"
                    (change)="onVendorChange()">
              <option value="">Select Vendor</option>
              
              <option *ngFor="let v of vendorList" [value]="v.param1">
                {{v.param2}}
              </option>
            </select>
          </div>

          <!-- RTO -->
          <div class="form-group" *ngIf="filterBy === 'RTO'">
            <label class="control-label">Select RTO <span style="color:red">*</span></label>
            <select class="searchable full-control"
                    [(ngModel)]="selectedRTO"
                    (change)="onRTOChange()">
              <option value="">Select RTO</option>
           
              <option *ngFor="let r of rtoList" [value]="r.param1">
                {{r.param2}}
              </option>
            </select>
          </div>

          <!-- VEHICLE -->
          <div class="form-group">
            <label class="control-label">Select Vehicle / Chassis No <span style="color:red">*</span></label>
         

<!-- 🔍 SEARCH BOX -->
<div class="vehicle-search-box">

  <input type="text"
         class="form-control search-input"
         placeholder="Enter Last 4 Digits"
         maxlength="4"
         inputmode="numeric"
         pattern="[0-9]*"
         [(ngModel)]="vehicleSearch"
         (ngModelChange)="onVehicleSearchChange()"
         (keyup.enter)="searchVehicle()" />

<button class="btn-search-blue"
        (click)="searchVehicle()">
  <i class="fa fa-search"></i>
</button>

</div>


<!-- 🚗 DROPDOWN -->

<select *ngIf="isVehicleLoaded && visibleVehicleList.length > 0"
        class="searchable full-control"
        [(ngModel)]="selectedVehicle"
        placeholder="Select Vehicle">
  <option value="" disabled selected hidden>
    Select Vehicle
  </option>
  <option [ngValue]="null">Select Vehicle</option>

  <option *ngFor="let v of visibleVehicleList"
          [ngValue]="v.param1">
    {{ v.param2 }}
  </option>

</select>
            
          </div>

          <!-- ALERT TYPE -->
          <!-- <div class="form-group">
            <label class="control-label">Alert Type <span style="color:red">*</span></label>
            <select class="searchable full-control"
                    [(ngModel)]="selectedAlertType">
              <option value="">Select Alert</option>
              
              <option *ngFor="let a of alertTypeList" [value]="a.param1">

          <!-- DATE -->
      <div class="date-row">
  <div class="date-col" style="width:100%">
    <label class="control-label">Select Date Range<span style="color:red">*</span> </label>
    <input
    placeholder="Select Date Range"
      type="text"
      class="form-control"
      ngxDaterangepickerMd
      [(ngModel)]="selectedDateRange"
      [maxDate]="today"
       [opens]="'right'"
 [drops]="'up'"
      [locale]="{ format: 'DD-MMM-YYYY' }"
      (applyDaterangepicker)="onDateRangeChange($event)"
    />
    
  </div>
</div>

<div class="date-row">

  <div class="date-col">
    <label class="control-label">From Time<span style="color:red">*</span></label>
    <input
      type="time"
      class="form-control"
      [(ngModel)]="fromTime"
      step="60"
    />
  </div>

  <div class="date-col">
    <label class="control-label">To Time<span style="color:red">*</span></label>
    <input
      type="time"
      class="form-control"
      [(ngModel)]="toTime"
      step="60"
    />
  </div>

</div>
          <!-- SEARCH -->
          <div class="search-btn-row">
            <button class="search-btn-full"
                    (click)="getAlertOverview()">
             <i class="fa fa-search"></i>   Search
            </button>
          </div>
        </div>
<!-- *ngIf="showSummary" -->
        <!-- RIGHT REPORT PANEL -->
        <div class="right-report-panel" >
<!-- 🔹 TOP CONTROLS BAR -->
<div class="top-controls-row">

  <!-- LEFT SIDE -->
  <div class="left-controls">

    <!-- 🔍 SEARCH BOX -->
    <div class="search-box">
      <input
        type="search"
        class="search-input inner"
        placeholder="Search vehicle / alert..."
        maxlength="50"
        [(ngModel)]="searchText"
        (keyup.enter)="getSearchDetails()" />

      <button class="search-inner-btn" (click)="getSearchDetails()">
        <i class="fa fa-search"></i>
      </button>
    </div>

    <!-- 🔄 RELOAD BUTTON -->
    <button
      class="reload-btn"
      (click)="reloadData()"
      [disabled]="loading">

      <i class="fa fa-refresh" [class.fa-spin]="loading"></i>
      <span>{{ loading ? 'Reloading...' : 'Reload' }}</span>

    </button>

  </div>

  <!-- RIGHT SIDE -->
  <div class="right-controls">
    <app-common-data-toolbar [showSearch]="false" [showReload]="false" [showExcel]="true"
      [showPageSize]="false" [showTotal]="false" [exportLoading]="loading"
      (excelExport)="exportToExcel()"></app-common-data-toolbar>
 <div class="total-records-text">Show Rows :</div>
    <!-- ROWS SELECT -->
    <select
      class="rows-select"
      [(ngModel)]="pageSize"
      (change)="onPageSizeChanged(pageSize)">

      <option *ngFor="let size of pageSizeOptions"
              [value]="size === totalCount ? 'All' : size">
        {{ size === totalCount ? 'All' : size }}
      </option>

    </select>

    <!-- TOTAL RECORD TEXT -->
    <div class="total-records-text">
     Total Records : {{ pageCount }} of {{ totalCount }}
    </div>

  </div>

</div>
          <!-- TABLE -->
          <div class="table-wrapper" >
            <app-common-table
              [columns]="tableColumns"
              [rows]="alertData"
              emptyMessage="NO DATA FOUND"
              tableClass="table-grid">
            </app-common-table>
          </div>
          <div class="custom-pagination"style="display:flex;justify-content: end;" *ngIf="totalCount > pageSize || page > 1">

  <button class="pg-btn"
          (click)="changePage(page - 1)"
          [disabled]="page === 1">
    Prev
  </button>

  <span *ngIf="page > 3" class="pg-dots">...</span>

  <button *ngIf="page > 2"
          class="pg-num"
          (click)="changePage(page - 1)">
    {{ page - 1 }}
  </button>

  <button class="pg-num active">
    {{ page }}
  </button>

  <button *ngIf="page < totalPages - 1"
          class="pg-num"
          (click)="changePage(page + 1)">
    {{ page + 1 }}
  </button>

  <span *ngIf="page < totalPages - 2" class="pg-dots">...</span>

  <button class="pg-num"
          (click)="changePage(totalPages)">
    {{ totalPages }}
  </button>

  <button class="pg-btn"
          (click)="changePage(page + 1)"
          [disabled]="page === totalPages">
    Next
  </button>

</div>
        </div>

      </div>
    </div>
  </div>
</div>
