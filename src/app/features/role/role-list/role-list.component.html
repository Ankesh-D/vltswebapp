<div class="content-i">
  <div class="content-box">
    <div class="element-wrapper">
      <div class="element-box">
        <div class="col-md-12 pagetitleborder">
             <div class="pagetitlestyle"><span>Role Details</span></div>
          <button class="pagebtn" style="margin-right: 10px;">
            <a routerLink="/role/entry"><i class="fa fa-plus"></i>&nbsp;&nbsp;Add New</a>
          </button>
       
        </div>

        <!-- Search and Pagination Controls -->
      
<form autocomplete="off" class="list-toolbar">

  <!-- Left: Search and Actions -->
  <div class="toolbar-left">

    <div class="search-group">
      <input
        type="search"
        class="tabletitlesearch"
        id="searchby"
        placeholder="Type here..."
        maxlength="50"
        [(ngModel)]="searchText"
        (keyup.enter)="getSearchDetails()"
        name="searchby"
      />

      <button
        type="button"
        class="search-btn"
        title="Search"
        (click)="getSearchDetails()">
        <i class="fa fa-search"></i>
      </button>
    </div>

    <button
      type="button"
      class="reload-btn"
      title="Reload"
      [disabled]="loading"
      (click)="reloadData()">
      <i class="fa"
         [ngClass]="loading ? 'fa-spinner fa-spin' : 'fa-refresh'">
      </i>
    </button>

    <button
      type="button"
      class="excel-btn">
      <i class="fa fa-file-excel-o"></i>
      Excel
    </button>

  </div>

  <!-- Right: Pagination -->
  <div class="toolbar-right">

    <select
      [(ngModel)]="pageSize"
      (change)="onPageSizeChange(pageSize)"
      name="pageSize"
      class="page-size-select">

      @for (size of pageSizeOptions; track size) {
        <option [value]="size === totalCount ? 'All' : size">
          {{ size === totalCount ? 'All' : size }}
        </option>
      }

    </select>

    <div class="record-count">
      <strong>Total Records:</strong>
      <span>{{ pageCount }} of {{ totalCount }}</span>
    </div>

  </div>

</form>


        <div class="table-responsive">
          <div id="dataTable1_wrapper" class="dataTables_wrapper container-fluid dt-bootstrap4">
            <div class="col-sm-12">
              <app-common-table [columns]="tableColumns" [rows]="getPaginatedRoles()" [loading]="loading"
                [sortKey]="sortKey" [reverse]="reverse" [cellTemplate]="roleListCell"
                tableClass="table table-striped app-table" tableId="devicetable"
                tableStyle="border-top: 1px solid black; border-bottom: 1px solid black; margin-left: 0px;"
                (sortChange)="sort($event)">
              </app-common-table>
            
<ng-template #roleListCell let-role let-column="column">
  @if (column.key === 'actions') {
    <div class="role-action-buttons">

      <button
        type="button"
        class="role-edit-btn"
        (click)="openEditModal(role)">
        Edit
      </button>

      <button
        type="button"
        class="role-delete-btn"
        (click)="openDeleteModal(role)">
        Delete
      </button>

    </div>
  } @else {
    {{ column.value ? column.value(role) : 'NA' }}
  }
</ng-template>


           
@if (totalCount > 0) {
  <div class="pagination-wrapper">

    <ngb-pagination
      [collectionSize]="totalCount"
      [pageSize]="pageSize"
      [page]="currentPage"
      [maxSize]="5"
      [rotate]="true"
      [ellipses]="true"
      [boundaryLinks]="true"
      [directionLinks]="true"
      firstText="««"
      previousText="«"
      nextText="»"
      lastText="»»"
      (pageChange)="onPageChange($event)">
    </ngb-pagination>

  </div>
}

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Edit Role Modal -->
@if (showEditModal) {
  <div class="modal-overlay" (click)="closeEditModal()">
    <div class="modal-content" (click)="$event.stopPropagation()" style="width: 700px;">
      <div class="modal-header">
        <h5 class="modal-title">Update</h5>
        <button type="button" class="close" (click)="closeEditModal()" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="table-responsive">
          <table class="table table-bordered">
            <thead>
              <div class="row">
                <div class="col-sm-4">
                  <div class="form-group">
                    <label for="" style="font-size: 11px; font-weight: bold;">Role Name:</label><label for="" class="mandetory">*</label>
                    <input
                      type="text"
                      name="rolename"
                      id="rolename"
                      placeholder="Role Name"
                      class="form-control ignorespecialcharacter_space"
                      maxlength="50"
                      [(ngModel)]="editRoleName">
                  </div>
                </div>
                <div class="col-sm-4">
                  <div class="form-group">
                    <label for="" style="font-size: 11px; font-weight: bold;">Role Description:</label><label for="" class="mandetory">*</label>
                    <textarea
                      id="roledescription"
                      class="form-control ignorespecialcharacter_address"
                      placeholder="Role Description"
                      maxlength="100"
                    [(ngModel)]="editRoleDescription"></textarea>
                  </div>
                </div>
                <div class="col-sm-4">
                  <div class="form-group">
                    <label for="" style="font-size: 11px; font-weight: bold;">Remark:</label><label for="" class="mandetory">*</label>
                    <textarea
                      class="form-control ignoresymbol_name"
                      id="remark"
                      placeholder="Remark"
                      maxlength="100"
                      [(ngModel)]="editRemark"
                      (keyup)="validateEditRemark()"
                    [style.border]="isIncorrect ? '1px solid red' : '1px solid green'"></textarea>
                  </div>
                </div>
              </div>
            </thead>
            <tr style="display: none">
              <td colspan="3"></td>
            </tr>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" [disabled]="isIncorrect || loading" (click)="updateRole()">
          @if (!loading) {
            <span>Submit</span>
          }
          @if (loading) {
            <span>Submitting...</span>
          }
        </button>
        <button type="button" (click)="closeEditModal()">Back</button>
      </div>
    </div>
  </div>
}

<!-- Delete Role Modal -->
@if (showDeleteModal) {
  <div class="modal-overlay" (click)="closeDeleteModal()">
    <div class="modal-content modal-sm" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h5 class="modal-title">Delete</h5>
        <button type="button" class="close" (click)="closeDeleteModal()" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="table-responsive">
          <span style="font-size: 11px;">Role Name : <font>{{selectedRole?.param3 || 'NA'}}</font></span><br>
          <table class="table table-bordered">
            <thead>
              <textarea
                class="form-control ignoresymbol_name"
                id="deleteremark"
                placeholder="Remark"
                style="background: white; color: black;"
                maxlength="50"
                [(ngModel)]="deleteRemark"
                (keyup)="validateDeleteRemark()"
              [style.border]="isIncorrect ? '1px solid red' : '1px solid green'"></textarea>
            </thead>
            <div style="text-align: center; margin-top: 10px;">
              <button type="button" [disabled]="isIncorrect || loading" (click)="deleteRole()">
                @if (!loading) {
                  <span>Submit</span>
                }
                @if (loading) {
                  <span>Submitting...</span>
                }
              </button>
              <button type="button" (click)="closeDeleteModal()">Back</button>
            </div>
          </table>
        </div>
      </div>
    </div>
  </div>
}
