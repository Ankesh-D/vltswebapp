<div class="content-i">
  <div class="content-box">
    <div class="element-wrapper">
      <div class="element-box">
        <div class="dataTables_wrapper container-fluid dt-bootstrap4">
          <div class="col-md-12 pagetitleborder">
            <div class="page-header-row d-flex mt-1">
              <div class="pagetitlestyle">
                {{ filterType }} Details
              </div>
              <div class="today-alert-tab-item home-button" (click)="goToAdminDashboard()"
                title="Go to Admin Dashboard"
                style="margin-left: auto; cursor: pointer; background: #0b58b9; color: white; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;">
                <i class="fa fa-home"></i>
              </div>
            </div>
          </div>

          <app-common-data-toolbar
            variant="device"
            searchLabel="Search :"
            searchPlaceholder="Type here..."
            [searchText]="searchText"
            (searchTextChange)="searchText = $event"
            (search)="getSearchDetails()"
            (reload)="reloadData()"
            [loading]="loading"
            [showFilters]="false"
            [showExcel]="false"
            [showPdf]="false"
            [pageSize]="pageSize"
            [pageSizeOptions]="pageSizeOptions"
            [displayedCount]="pageCount"
            [totalRecords]="totalCount"
            (pageSizeChange)="onPageSizeChange($event)"
            pageSizeLabel="Show Rows"
            totalLabel="Total Records"
            countSeparator="of">
          </app-common-data-toolbar>

          <div class="col-sm-12 px-0">
            <app-data-table
              [columns]="tableColumns"
              [rows]="devices"
              [loading]="loading"
              [sortKey]="sortKey"
              [reverse]="reverse"
              (sort)="sort($event)"
              tableClass="table-striped app-table table app-table mb-1"
              tableId="devicetable"
              tableStyle="font-size: 11px; border-top: 1px solid black; border-bottom: 1px solid black; margin-left: 0px;"
              headerClass="device-thead"
              emptyMessage="NO DATA FOUND">
            </app-data-table>

            <div class="float-end">
              <app-pagination
                [totalCount]="totalCount"
                [page]="currentPage"
                [pageSize]="pageSize"
                [disabled]="loading"
                (pageChange)="onPageChange($event)">
              </app-pagination>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
