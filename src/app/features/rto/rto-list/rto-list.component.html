<div class="content-i">
  <div class="content-box">
    <!-- <div class="element-wrapper"> -->
    <!-- Home Button (when type is dashboard) -->


    <div class="element-box">
      <div class="col-md-12 pagetitleborder">
        <div class="pagetitlestyle"><span>RTO Details</span></div>
        @if (type !== '10') {
          <button class="pagebtn" style="margin-right: 10px">
            <a routerLink="/rto/entry"><i class="fa fa-plus"></i>&nbsp;&nbsp;Add New</a>
          </button>
        }

      </div>

      <!-- Error Message Display -->
      @if (errorMessage) {
        <div class="alert alert-warning alert-dismissible fade show" role="alert">
          {{ errorMessage }}
          <button type="button" class="close" aria-label="Close" (click)="errorMessage = ''">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
      }
      <app-common-data-toolbar variant="device" searchLabel="Search :" searchPlaceholder="Type here and press button..."
        [searchText]="searchText" (searchTextChange)="searchText = $event" (search)="getSearchDetails()"
        (reload)="reloadData()" [loading]="loading" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions"
        [displayedCount]="pageCount" [totalRecords]="totalCount" [showFilters]="true"
        pageSizeLabel="Show Rows" totalLabel="Total Records" countSeparator="of"
        (pageSizeChange)="onPageSizeChange($event)">
        <div toolbarFilters class="d-flex align-items-center">
          <label class="me-2 mb-0" for="rto-state-filter">State:</label>
          <select id="rto-state-filter" name="statename" [(ngModel)]="selectedStateCode"
            (ngModelChange)="onStateChange()" class="form-select form-select-sm">
            <option value="">All States</option>
            @for (rto of rtolist; track rto) {
              <option [value]="rto.param1">{{ rto.param2 }}</option>
            }
          </select>
        </div>
      </app-common-data-toolbar>
      <div class="table-responsive">
        <app-data-table [columns]="tableColumns" [rows]="rtos" [loading]="loading"
          [sortKey]="sortKey" [reverse]="reverse" tableClass="table table-striped app-table mb-1"
          tableId="devicetable" tableStyle="border-top: 1px solid black; border-bottom: 1px solid black; margin-left: 0px;"
          (sort)="sort($event)">
        </app-data-table>
      </div>
      <div class="float-end">
        <app-pagination [totalCount]="totalCount" [page]="currentPage" [pageSize]="pageSize"
          (pageChange)="onPageChange($event)"></app-pagination>
      </div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
@if (showEditModal) {
  <div class="modal-overlay" (click)="closeEditModal()">
    <div class="modal-box" (click)="$event.stopPropagation()">
      <!-- HEADER -->
      <div class="modal-header">
        <span class="modal-title">Update RTO</span>
        <button class="modal-close" (click)="closeEditModal()">&times;</button>
      </div>
      <!-- BODY -->
      <div class="modal-body">
        <div class="form-row">
          <div class="form-field">
            <label>RTO Code <span class="mandetory">*</span></label>
            <input class="form-control"
              maxlength="5"
              placeholder="{{ stateCode }}30"
              type="text"
              [(ngModel)]="rtoCode"
              name="rtoCode"
              autocomplete="off"
              style="text-transform: uppercase" />
          </div>
          <div class="form-field">
            <label>Pin Code <span class="mandetory">*</span></label>
            <input class="form-control"
              maxlength="6"
              placeholder="PIN Code"
              type="text"
              [(ngModel)]="pinCode"
              name="pinCode"
              autocomplete="off" />
          </div>
        </div>
        <div class="form-field full">
          <label>Remark <span class="mandetory">*</span></label>
          <textarea class="form-control"
            placeholder="Remark"
            maxlength="100"
            [(ngModel)]="updateRemark"
          name="updateRemark"></textarea>
        </div>
      </div>
      <!-- FOOTER -->
      <div class="modal-footer">
        <button class="btn-primary-ui" (click)="editRTODetails()">Submit</button>
        <button class="btn-secondary-ui" (click)="closeEditModal()">Back</button>
      </div>
    </div>
  </div>
}

<!-- Delete Modal -->
@if (showDeleteModal) {
  <div class="modal-overlay" (click)="closeDeleteModal()">
    <div class="modal-box delete-modal" (click)="$event.stopPropagation()">
      <!-- HEADER -->
      <div class="modal-header danger">
        <span class="modal-title">Delete RTO</span>
        <button class="modal-close" (click)="closeDeleteModal()">&times;</button>
      </div>
      <!-- BODY -->
      <div class="modal-body">
        <div class="warning-text">
          Are you sure you want to delete RTO:
          <strong>{{ rtoName }}</strong> ?
        </div>
        <div class="form-field full">
          <label>Remark <span class="mandetory">*</span></label>
          <textarea class="form-control"
            placeholder="Enter remark (min 10 characters)"
            [(ngModel)]="deleteRemark"
            name="deleteRemark"
          maxlength="100"></textarea>
        </div>
      </div>
      <!-- FOOTER -->
      <div class="modal-footer">
        <button class="btn-danger-ui" (click)="deleteRTODetails()">Delete</button>
        <button class="btn-secondary-ui" (click)="closeDeleteModal()">Cancel</button>
      </div>
    </div>
  </div>
}
