<div class="content-i">
  <div class="content-box">
    <div class="element-wrapper">
      <div class="element-box">

        <!-- HEADER -->
        <div class="col-md-12 pagetitleborder">
          <div class="pagetitlestyle">
            <span>SIM Validity Update</span>
          </div>
        </div>

        <!-- FORM -->
        <div class="entrypagediv">
          <form [formGroup]="simForm">

            <!-- ROW 1 -->
            <div class="form-row ">
              <div class="form-group">
                <label>ICCID</label>
                <input
                  class="form-control"
                  placeholder="Enter ICCID"
                  formControlName="iccid" />
              </div>

              <div class="form-group">
                <label>M2M Provider</label>
                <select class="form-control" formControlName="m2m">
                  <option value="">Select M2M Provider</option>
                  @for (provider of m2mProviderList; track provider) {
                    <option [value]="provider.param1">
                      {{ provider.param2 }}
                    </option>
                  }
                </select>
              </div>

              <div class="form-group">
                <label>Customer Mobile</label>
                <input
                  class="form-control"
                  placeholder="Enter Customer Mobile"
                  formControlName="customerMobile" />
              </div>
            </div>

            <!-- ROW 2 -->
            <div class="form-row">
              <div class="form-group">
                <label>Mobile 1</label>
                <input
                  class="form-control"
                  placeholder="Enter Primary Mobile"
                  formControlName="mobile1" />
              </div>

              <div class="form-group">
                <label>Network 1</label>
                <select class="form-control" formControlName="network1">
                  <option value="">Select Network</option>
                  @for (network of networkList; track network) {
                    <option [value]="network.param2">
                      {{ network.param2 }}
                    </option>
                  }
                </select>
              </div>
              <div class="form-group">

              </div>
            </div>

            <!-- ROW 3 -->
            <div class="form-row">
              <div class="form-group">
                <label>Mobile 2</label>
                <input
                  class="form-control"
                  placeholder="Enter Secondary Mobile"
                  formControlName="mobile2" />
              </div>

              <div class="form-group">
                <label>Network 2</label>
                <select class="form-control" formControlName="network2">
                  <option value="">Select Network</option>
                  @for (network of networkList; track network) {
                    <option [value]="network.param2">
                      {{ network.param2 }}
                    </option>
                  }
                </select>
              </div>

              <div class="form-group">
                <label>Validity</label>
                <input
                  type="date"
                  class="form-control"
                  formControlName="validity2" />
              </div>
            </div>

            <!-- BUTTON -->
            <div class="form-actions">
              <button type="button" class="btn-submit" (click)="saveData()">
                Update SIM
              </button>

              <button type="button" class="btn-reset" (click)="resetForm()">
                Reset
              </button>
            </div>

          </form>
        </div>

      </div>
    </div>
  </div>
</div>
