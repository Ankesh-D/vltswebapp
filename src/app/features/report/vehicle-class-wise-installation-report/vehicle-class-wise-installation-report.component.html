<!-- vehicle-class-wise-installation-report.component.html -->

<div class="content-i">

  <div class="content-box">

    <div class="element-wrapper">

      <div class="element-box">

        <!-- HEADER -->
        <div class="table-responsive">

          <div
            id="dataTable1_wrapper"
            class="dataTables_wrapper container-fluid dt-bootstrap4"
            >

            <!-- PAGE TITLE -->
            <div class="col-md-12 pagetitleborder">

              <div class="page-header-row">

                <!-- TITLE -->
                <div class="pagetitlestyle">
                  Vehicle Class Wise Installation Report
                </div>

              </div>

            </div>

            <app-common-data-toolbar
              [searchText]="searchBy"
              searchPlaceholder="Search..."
              (searchTextChange)="searchBy=$event"
              (search)="searchReport()"
              (reload)="resetFilters()"
              [loading]="loading"
              [showFilters]="true"
              [pageSize]="itemPerPage"
              [pageSizeOptions]="pageSizeOptions"
              [displayedCount]="reportList.length"
              [totalRecords]="totalRecords"
              (pageSizeChange)="onPageSizeChange($event)"
              (excelExport)="downloadReport()"
              pageSizeLabel="Show Rows"
              totalLabel="Total Records">
              <div toolbarFilters class="d-flex align-items-center gap-2 flex-wrap">
                <label class="mb-0">Vehicle Class:</label>
                <select [(ngModel)]="selectedVehicleClass" name="selectedVehicleClass"
                  (change)="searchReport()">
                  <option value="">All</option>
                  @for (item of vehicleClassList; track item) {
                    <option [value]="item.param1">{{ item.param2 }}</option>
                  }
                </select>
              </div>
            </app-common-data-toolbar>

            <!-- TABLE -->
            <div class="col-sm-12">

              <ng-template #reportTableRows let-rows>
<!-- NO DATA -->
                @if (reportList.length === 0) {
                  <tr>
                    <td
                      colspan="8"
                      class="no-data"
                      >
                      NO DATA FOUND
                    </td>
                  </tr>
                }

                <!-- DATA -->
                @for (
                  d of rows; track
                  d; let i = $index) {
                  <tr
                    >
                    <td >
                      {{ d.param1 || 'NA' }}
                    </td>
                    <td style="text-align: left; padding-left: 10px;">
                      {{ d.param3 || 'NA' }}
                    </td>
                    <td style="text-align: right; padding-right: 10px;">
                      {{ d.param4 || '0' }}
                    </td>
                    <td style="text-align: right; padding-right: 10px;">
                      {{ d.param9 || '0' }}
                    </td>
                    <td style="text-align: right; padding-right: 10px;">
                      {{ d.param5 || '0' }}
                    </td>
                    <td style="text-align: right; padding-right: 10px;">
                      {{ d.param6 || '0' }}
                    </td>
                    <td style="text-align: right; padding-right: 10px;">
                      {{ d.param7 || '0' }}
                    </td>
                    <!-- <td style="text-align: right; padding-right: 10px;">
                    {{ d.param8 || '0' }}
                  </td> -->
                </tr>
              }
</ng-template>
<app-data-table [columns]="tableColumns" [rows]="reportList" [loading]="loading" [emptyMessage]="'NO DATA FOUND'" [bodyTemplate]="reportTableRows" tableClass="table-striped table app-table" headerClass="device-thead" tableStyle="border-top: 1px solid black;
                  border-bottom: 1px solid black;
                  margin-left: 0px;"></app-data-table>

        </div>

      </div>

    </div>

    <!-- PAGINATION -->
    <app-pagination [totalCount]="totalRecords" [page]="pageNo" [pageSize]="itemPerPage"
      [disabled]="loading" (pageChange)="changePage($event)">
    </app-pagination>

  </div>

</div>

</div>

</div>
