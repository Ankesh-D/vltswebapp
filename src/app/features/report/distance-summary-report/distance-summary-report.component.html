<div class="content-i">
  <div class="content-box">
    <div class="row">
      <div class="col-lg-12">
        <div class="element-wrapper">
          <div class="element-box">

            <!-- PAGE TITLE -->
            <div class="col-md-12 pagetitleborder">
              <div class="pagetitlestyle">
                <span>Distance Summary</span>
              </div>
            </div>

            <form>
              <div class="report-layout">

                <!-- LEFT FILTER PANEL -->
                <div class="entrypagediv left-filter-panel">

                  <!-- Filter By -->
                  <div class="form-group filterby-row">
  <label class="control-label filterby-label">Filter By :</label>

  <div class="filterby-options">

    <label class="radio-item" for="vendorbtn">
            <label for="vendorname" class="control-label">
                      Vendor <b style="color: Red; font-weight: normal;">*</b>
                      </label>
      <input
        class="form-check-input"
        value="Vendor"
        id="vendorbtn"
        type="radio"
        [(ngModel)]="filterBy"
        (click)="onFilterChange('Vendor')"
        name="filterBy"
      />
     
    </label>

    <label class="radio-item" for="rtobtn">
            <label for="vendorname" class="control-label">
                    RTO <b style="color: Red; font-weight: normal;">*</b>
                      </label>
      <input
        class="form-check-input"
        value="RTO"
        id="rtobtn"
        type="radio"
        [(ngModel)]="filterBy"
        (click)="onFilterChange('RTO')"
        name="filterBy"
      />
   
    </label>

  </div>
</div>


                  <!-- Vendor -->
                  <div class="full-width-field" *ngIf="filterBy === 'Vendor'">
                    <div class="form-group">
                      <label for="vendorname" class="control-label">
                        Search By Vendor <b style="color: Red; font-weight: normal;">*</b>
                      </label>
                      <select class="searchable full-control" id="vendorname"
                        [(ngModel)]="selectedVendorId" (change)="onVendorChange()" name="vendorname">
                        <option value="">Select Vendor</option>
                        <option *ngFor="let vendor of vendorList" [value]="vendor.param1">{{vendor.param2}}</option>
                      </select>
                    </div>
                  </div>

                  <!-- RTO -->
                  <div class="full-width-field" *ngIf="filterBy === 'RTO'">
                    <div class="form-group">
                      <label for="rtoname" class="control-label">
                        Search By RTO <b style="color: Red; font-weight: normal;">*</b>
                      </label>
                      <select class="searchable full-control" id="rtoname"
                        [(ngModel)]="selectedRTOId" (change)="onRTOChange()" name="rtoname">
                        <option value="">Select RTO</option>
                        <option *ngFor="let rto of rtoList" [value]="rto.param1">{{rto.param2}}</option>
                      </select>
                    </div>
                  </div>

                  <!-- Vehicle -->
                  <div class="full-width-field">
                    <div class="form-group" id="vehdiv">
                      <label for="vehicleno" class="control-label">
                        Select Vehicle/Chassis No. <b style="color: Red; font-weight: normal;">*</b>
                      </label>
                      <select class="searchable full-control" id="vehicleno"
                        [(ngModel)]="selectedVehicleId" name="vehicleno">
                        <option value="">Select Vehicle/Chassis No.</option>
                        <option value="All">All</option>
                        <option *ngFor="let vehno of vehicleList" [value]="vehno.param1">{{vehno.param2}}</option>
                      </select>
                    </div>
                  </div>

                  <!-- DATE ROW -->
                  <div class="two-col-row">
                    <div class="two-col">
                      <label for="fromdate" class="control-label">
                        From Date <b style="color:red; font-weight:normal;">*</b>
                      </label>
                      <input class="form-control datepick" type="text" id="fromdate"
                        [(ngModel)]="fromDate" name="fromdate" />
                    </div>

                    <div class="two-col">
                      <label for="todate" class="control-label">
                        To Date <b style="color:red; font-weight:normal;">*</b>
                      </label>
                      <input class="form-control datepick" type="text" id="todate"
                        [(ngModel)]="toDate" name="todate" />
                    </div>
                  </div>

                  <!-- TIME ROW -->
                  <div class="two-col-row">
                    <div class="two-col">
                      <label for="fromtime" class="control-label">
                        From Time <b style="color:red; font-weight:normal;">*</b>
                      </label>
                      <input class="form-control timepicker1" id="fromtime"
                        [(ngModel)]="fromTime" name="fromtime" />
                    </div>

                    <div class="two-col">
                      <label for="totime" class="control-label">
                        To Time <b style="color:red; font-weight:normal;">*</b>
                      </label>
                      <input class="form-control timepicker2" id="totime"
                        [(ngModel)]="toTime" name="totime" />
                    </div>
                  </div>

                  <!-- SEARCH BUTTON -->
                  <div class="search-btn-row">
                    <button class="search-btn-full" type="button" (click)="getDistanceData()">
                      Search
                    </button>
                  </div>

                </div>

                <!-- RIGHT PANEL -->
                <div class="right-report-panel" >

                  <!-- SUMMARY -->
                  <div class="row" *ngIf="showSummary">
                    <div class="col-md-3"></div>
                    <div class="col-md-6">
                      <table class="table" id="summarytable">
                        <tbody>
                          <tr>
                            <td class="tabledtafont">{{selectName}}</td>
                            <td class="tabledtafont">{{searchValue}}</td>
                          </tr>
                          <tr>
                            <td class="tabledtafont">Vehicle/Chassis No.</td>
                            <td class="tabledtafont">{{searchVelRto}}</td>
                          </tr>
                          <tr>
                            <td class="tabledtafont">Date</td>
                            <td class="tabledtafont">{{dateRange}}</td>
                          </tr>
                          <tr>
                            <td class="tabledtafont">Time</td>
                            <td class="tabledtafont">{{timeRange}}</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <!-- TOP BAR -->
                  <div class="topbar-row">
                    <div class="topbar-left">
                      <span class="topbar-label">Search :</span>

                      <input type="search"
                        readonly onfocus="this.removeAttribute('readonly');"
                        class="topbar-search"
                        id="searchby"
                        placeholder="Type here and press button...."
                        autocomplete="disabled"
                        maxlength="50"
                        [(ngModel)]="searchText"
                        (keyup.enter)="getSearchDetails()"
                        name="searchby">

                      <button class="topbar-search-btn" type="button" (click)="getSearchDetails()">
                        <i class="fa fa-search"></i>
                      </button>

                      <button class="topbar-reload-btn" type="button" (click)="reloadData()">
                        Reload
                      </button>
                    </div>

                    <div class="topbar-right">
                      <span class="topbar-right-item">
                        <span class="topbar-label">Show Rows :</span>
                        <select class="topbar-select"
                          [(ngModel)]="pageSize"
                          (change)="onPageSizeChange($event)"
                          name="pageSize">
                          <option *ngFor="let size of pageSizeOptions" [value]="size === totalCount ? 'All' : size">
                            {{size === totalCount ? 'All' : size}}
                          </option>
                        </select>
                      </span>

                      <span class="topbar-total">
                        Total Records : {{pageCount}} of {{totalCount}}
                      </span>
                    </div>
                  </div>

                  <!-- TABLE -->
                  <app-common-table [columns]="tableColumns" [rows]="getPaginatedData()" [loading]="loading"
                    [sortKey]="sortKey" [reverse]="reverse" (sortChange)="sort($event)"
                    tableClass="table table-striped app-table" tableId="devicetable"
                    wrapperClass="table-wrapper" emptyMessage="NO DATA FOUND">
                  </app-common-table>

                  <!-- PAGINATION -->
                  <div class="pagination-wrapper" *ngIf="getTotalPages() > 1">
                    <ul class="pagination">
                      <li [class.disabled]="currentPage === 1">
                        <button type="button" (click)="onPageChange(currentPage - 1)" [disabled]="currentPage === 1">
                          Previous
                        </button>
                      </li>

                      <li *ngFor="let page of getPageNumbers()" [class.active]="currentPage === page">
                        <button type="button" (click)="onPageChange(page)">{{page}}</button>
                      </li>

                      <li [class.disabled]="currentPage >= getTotalPages()">
                        <button type="button" (click)="onPageChange(currentPage + 1)" [disabled]="currentPage >= getTotalPages()">
                          Next
                        </button>
                      </li>
                    </ul>
                  </div>

                </div>

              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
