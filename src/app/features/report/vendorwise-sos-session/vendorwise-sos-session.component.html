<div class="content-i">
  <div class="content-box">
    <div class="element-box">

      <!-- PAGE TITLE -->
      <div class="pagetitlestyle">
        <span>Vendorwise SOS Session Report</span>
      </div>

      <!-- MAIN LAYOUT -->
      <div class="overspeed-layout">
        <!-- LEFT FILTER PANEL -->
        <app-common-data-toolbar [showFilters]="true" [showSearch]="false" [showReload]="false"
          [showExcel]="false" [showPageSize]="false" [showTotal]="false">
        <div toolbarFilters class="d-flex align-items-center gap-2 flex-wrap">
        <div class="left-filter-panel entrypagediv">

          <!-- VENDOR -->
          <div class="form-group">
            <label class="control-label">Select Vendor <span style="color:red">*</span></label>
            <ng-select name="vendor" class="searchable full-control" placeholder="Select Vendor"
              [(ngModel)]="selectedVendor">
              @for (v of vendorList; track v) {
                <ng-option [value]="v.param1">{{v.param2}}</ng-option>
              }
            </ng-select>
          </div>


          <!-- DATE -->
          <div class="date-row">
            <div class="date-col" style="width:100%">
              <label class="control-label">Select Date Range<span style="color:red">*</span> </label>
              <!-- <input
              placeholder="Select Date Range"
              type="text"
              class="form-control"
              ngxDaterangepickerMd
              [(ngModel)]="selectedDateRange"
              [maxDate]="today"
              [opens]="'right'"
              [drops]="'down'"
              [autoApply]="true"
              [locale]="locale"
              (datesUpdated)="onDateRangeChange($event)" /> -->
              <input type="text" id="datepicker" class="form-control" name="date"/>
            </div>
          </div>

          <div class="date-row">

            <div class="date-col">
              <label class="control-label">From Time<span style="color:red">*</span></label>
              <input type="time" class="form-control" [(ngModel)]="fromTime" step="60" />
            </div>

            <div class="date-col">
              <label class="control-label">To Time<span style="color:red">*</span></label>
              <input type="time" class="form-control" [(ngModel)]="toTime" step="60" />
            </div>

          </div>
          <!-- SEARCH -->
          <div class="search-btn-row">
            <button class="search-btn-full" (click)="getAlertOverview()">
              <i class="fa fa-search"></i> Search
            </button>
          </div>
        </div>
        </div>
        </app-common-data-toolbar>
        <!-- *ngIf="showSummary" -->
        <!-- RIGHT REPORT PANEL -->
        <div class="right-report-panel">
                                        <app-common-data-toolbar
                                          [searchText]="searchText"
                                          searchPlaceholder="Search here..."
                                          (searchTextChange)="searchText=$event"
                                          (search)="getSearchDetails()"
                                          (reload)="reloadData()"
                                          [loading]="loading"
                                          [pageSize]="pageSize"
                                          [pageSizeOptions]="pageSizeOptions"
                                          [displayedCount]="pageCount"
                                          [totalRecords]="totalCount"
                                          (pageSizeChange)="onPageSizeChanged($event)"
                                          (excelExport)="exportToExcel()"
                                          pageSizeLabel="Show Rows"
                                          totalLabel="Total Records"
                                          countSeparator="of">
                                        </app-common-data-toolbar>
          <!-- TABLE -->
          <ng-template #vendorSosRows let-rows>
            @for (d of rows; track d; let i = $index) {
              <tr>
                <td class="text-end">{{ i + 1 }}</td>
                <td>{{ d.param2 }}</td>
                <td class="text-end">{{ d.param3 != '' ? d.param3 : '-' }}</td>
                <td class="text-end">{{ d.param4 }}</td>
                <td class="text-end">{{ d.param5 != '' ? d.param5 : '-' }}</td>
                <td class="text-end">{{ d.param6 }}</td>
              </tr>
            }
          </ng-template>
          <app-data-table [columns]="tableColumns" [rows]="alertData" [loading]="loading"
            [emptyMessage]="'NO DATA FOUND'" [bodyTemplate]="vendorSosRows" tableClass="table-grid">
          </app-data-table>
          <app-pagination [totalCount]="totalCount" [page]="page" [pageSize]="pageSize"
            [disabled]="loading" (pageChange)="changePage($event)">
          </app-pagination>
        </div>

      </div>
    </div>
  </div>
</div>
