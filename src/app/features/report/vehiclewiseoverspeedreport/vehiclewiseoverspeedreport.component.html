          </div>

          <!-- DATE -->
          <div class="date-row">

          <!-- SEARCH -->
          <div class="search-btn-row">
            <button class="search-btn-full" (click)="getReportOverview()">
              <i class="fa fa-search"></i> Search
            </button>
          </div>
        </div>
        <!-- *ngIf="showSummary" -->
        <!-- RIGHT REPORT PANEL -->
        <div class="right-report-panel">
          <!-- 🔹 TOP CONTROLS BAR -->
          <div class="top-controls-row">

            <!-- LEFT SIDE -->
            <div class="left-controls">

              <!-- 🔍 SEARCH BOX -->
              <div class="search-box">
                <input type="search" class="search-input inner" placeholder="Search here..." maxlength="50"
                  [(ngModel)]="searchText" (keyup.enter)="getSearchDetails()" />

                <button class="search-inner-btn" (click)="getSearchDetails()">
                  <i class="fa fa-search"></i>
                </button>
              </div>

              <!-- 🔄 RELOAD BUTTON -->
              <button class="reload-btn" (click)="reloadData()" [disabled]="loading">

                <i class="fa fa-refresh" [class.fa-spin]="loading"></i>
                <span>{{ loading ? 'Reloading...' : 'Reload' }}</span>

              </button>

            </div>

            <!-- RIGHT SIDE -->
            <div class="right-controls">
              <app-common-data-toolbar [showSearch]="false" [showReload]="false" [showExcel]="true"
                   [showPageSize]="false" [showTotal]="false" (excelExport)="exportToExcel()">
              </app-common-data-toolbar>
              <div class="total-records-text">Show Rows :</div>
              <!-- ROWS SELECT -->
              <select class="rows-select" [(ngModel)]="pageSize" (change)="onPageSizeChanged(pageSize)">

                <option *ngFor="let size of pageSizeOptions" [value]="size === totalCount ? 'All' : size">
                  {{ size === totalCount ? 'All' : size }}
                </option>

              </select>

              <!-- TOTAL RECORD TEXT -->
              <div class="total-records-text">
                Total Records : {{ pageCount }} of {{ totalCount }}
              </div>

            </div>

          </div>
          <!-- TABLE -->
          <div class="table-wrapper">
            <ng-template #reportTableRows let-rows>
<tr *ngIf="alertData.length === 0">
                  <td colspan="10" class="no-data">
                    NO DATA FOUND
                  </td>
                </tr>

                <tr *ngFor="let d of rows; let i = index">
                  <td>{{ i + 1 }}</td>
                  <td>{{ d.param3 }}</td>
                  <td>{{ d.param4 !='' ? d.param4 : '-' }}<br>{{ d.param5 !='' ? d.param5 : '-' }}</td>
                  <td>{{ d.param10 }}</td>
                  <td class="text-end fw-bolder text-danger">{{ d.param11 }}</td>
                  <td>
                    <div class="text-center">
                      <button type="button" class="btn btn-sm btn-primary" (click)="viewMapModal(d)"
                        [attr.aria-label]="'Live tracking for ' + d.param3" title="Live tracking and history">
                        <i class="fa fa-map" aria-hidden="true"></i>
                      </button>
                    </div>
                  </td>
                </tr>
</ng-template>
<app-common-table [columns]="tableColumns" [rows]="alertData" [loading]="loading" [emptyMessage]="'NO DATA FOUND'" [bodyTemplate]="reportTableRows" tableClass="table-grid"></app-common-table>

         </div>

      </div>
    </div>
  </div>
</div>
