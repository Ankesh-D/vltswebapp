<div class="content-i">
  <div class="content-box">
    <div class="element-box">
      <!-- PAGE TITLE -->
      <div class="pagetitlestyle">
        <span>Activity Logs</span>
      </div>

      <!-- MAIN LAYOUT -->
      <div class="overspeed-layout">
        <!-- LEFT FILTER PANEL -->
        <div class="left-filter-panel entrypagediv">
          <div class="date-row">
            <div class="date-col" style="width: 100%">
              <label class="control-label"
                >Select Date Range<span style="color: red">*</span>
              </label>
              <input
                placeholder="Select Date Range"
                type="text"
                class="form-control"
                ngxDaterangepickerMd
                [(ngModel)]="selectedDateRange"
                [maxDate]="today"
                [opens]="'right'"
                [drops]="'down'"
                [locale]="{ format: 'DD-MMM-YYYY' }"
                (applyDaterangepicker)="onDateRangeChange($event)"
                id="dateRangePicker"
                />
            </div>
          </div>

          <div class="date-row">
            <div class="date-col">
              <label class="control-label"
                >From Time<span style="color: red">*</span></label
                >
                <input
                  type="time"
                  class="form-control"
                  [(ngModel)]="fromTime"
                  step="60"
                  />
              </div>

              <div class="date-col">
                <label class="control-label"
                  >To Time<span style="color: red">*</span></label
                  >
                  <input
                    type="time"
                    class="form-control"
                    [(ngModel)]="toTime"
                    step="60"
                    />
                </div>
              </div>
              <!-- SEARCH -->
              <div class="search-btn-row">
                <button class="search-btn-full" (click)="getAlertOverview()">
                  <i class="fa fa-search"></i> Search
                </button>
              </div>
            </div>
            <!-- *ngIf="showSummary" -->
            <!-- RIGHT REPORT PANEL -->
            <div class="right-report-panel">
              <app-common-data-toolbar
                [searchText]="searchText"
                searchPlaceholder="Search Page Name / Activity..."
                (searchTextChange)="searchText=$event"
                (search)="getSearchDetails()"
                (reload)="reloadData()"
                [loading]="loading"
                [pageSize]="pageSize"
                [pageSizeOptions]="pageSizeOptions"
                [displayedCount]="pageCount"
                [totalRecords]="totalCount"
                (pageSizeChange)="onPageSizeChanged($event)"
                (excelExport)="exportToExcel()"
                pageSizeLabel="Show Rows"
                totalLabel="Total Records"
                countSeparator="of">
              </app-common-data-toolbar>
              <!-- TABLE -->
              <div class="table-wrapper">
                <ng-template #reportTableRows let-rows>
@if (alertData.length === 0) {
                      <tr>
                        <td colspan="10" class="no-data">NO DATA FOUND</td>
                      </tr>
                    }
                    @for (d of rows; track d) {
                      <tr>
                        <td>{{ d.param1 }}</td>
                        <td class="text-left">
                          {{ d.param14 }}<br />
                          {{ d.param16 == "" ? "" : "(" + d.param16 + ")" }}
                        </td>
                        <!-- User Name -->
                        <td>{{ d.param2 }}</td>
                        <!-- Page Name -->
                        <td>{{ d.param4 }}</td>
                        <!-- Activity -->
                        <td class="wrap-text">{{ d.param13 }}</td>
                        <!-- Request -->
                        <td class="wrap-text">{{ d.param6 }}</td>
                        <td>{{ d.param5 }}</td>
                        <!-- Date Time -->
                        <td>{{ d.param7 }}</td>
                        <!-- Exception -->
                      </tr>
                    }
</ng-template>
<app-data-table [columns]="tableColumns" [rows]="alertData" [loading]="loading" [emptyMessage]="'NO DATA FOUND'" [bodyTemplate]="reportTableRows" tableClass="table-grid"></app-data-table>
              </div>
              <app-pagination [totalCount]="totalCount" [page]="page" [pageSize]="pageSize"
                [disabled]="loading" (pageChange)="changePage($event)">
              </app-pagination>
            </div>
          </div>
        </div>
      </div>
    </div>
