<div class="content-i">
  <div class="content-box">
    <div class="row">
      <div class="col-lg-12">
        <div class="element-wrapper">
          <div class="element-box">

            <!-- PAGE TITLE -->
            <div class="col-md-12 pagetitleborder">
              <div class="pagetitlestyle">
                <span>Alert Events</span>
              </div>
            </div>

            <form autocomplete="off">
              <div class="report-layout">

                <!-- LEFT FILTER PANEL -->
                <app-common-data-toolbar [showFilters]="true" [showSearch]="false" [showReload]="false"
                  [showExcel]="false" [showPageSize]="false" [showTotal]="false">
                <div toolbarFilters class="d-flex align-items-center gap-2 flex-wrap">
                <div class="entrypagediv left-filter-panel">

                  <!-- Filter By -->
                  <div class="form-group filterby-row">
                    <label class="control-label filterby-label">Filter By :</label>

                    <div class="filterby-options">
                      <label class="radio-item" for="vendorbtn">
                        <input class="form-check-input" value="Vendor" id="vendorbtn" type="radio"
                          [(ngModel)]="filterBy" (click)="onFilterChange('Vendor')" name="filterBy" />
                        <span>Vendor</span>
                      </label>

                      <label class="radio-item" for="rtobtn">
                        <input class="form-check-input" value="RTO" id="rtobtn" type="radio"
                          [(ngModel)]="filterBy" (click)="onFilterChange('RTO')" name="filterBy" />
                        <span>RTO</span>
                      </label>
                    </div>
                  </div>

                  <!-- Vendor -->
                  <div class="full-width-field" *ngIf="filterBy === 'Vendor'">
                    <div class="form-group" id="vendordiv">
                      <label for="vendorname" class="control-label">
                        Select Vendor <b style="color: Red; font-weight: normal;">*</b>
                      </label>
                      <select class="searchable full-control" id="vendorname"
                        [(ngModel)]="selectedVendorId" (change)="onVendorChange()" name="vendorname">
                        <option value="">Select Vendor</option>
                        <option *ngFor="let vendor of vendorList" [value]="vendor.param1">{{vendor.param2}}</option>
                      </select>
                    </div>
                  </div>

                  <!-- RTO -->
                  <div class="full-width-field" *ngIf="filterBy === 'RTO'">
                    <div class="form-group" id="rtodiv">
                      <label for="rtoname" class="control-label">
                        Select RTO <b style="color: Red; font-weight: normal;">*</b>
                      </label>
                      <select class="searchable full-control" id="rtoname"
                        [(ngModel)]="selectedRTOId" (change)="onRTOChange()" name="rtoname">
                        <option value="">Select RTO</option>
                        <option *ngFor="let rto of rtoList" [value]="rto.param1">{{rto.param2}}</option>
                      </select>
                    </div>
                  </div>

                  <!-- Vehicle -->
                  <div class="full-width-field">
                    <div class="form-group" id="vehdiv">
                      <label for="vehicleno" class="control-label">
                        Select Vehicle/Chassis No. <b style="color: Red; font-weight: normal;">*</b>
                      </label>
                      <select class="searchable full-control" id="vehicleno"
                        [(ngModel)]="selectedVehicleId" name="vehicleno">
                        <option value="">Select Vehicle/Chassis No.</option>
                        <option value="All">All</option>
                        <option *ngFor="let vehno of vehicleList" [value]="vehno.param1">{{vehno.param2}}</option>
                      </select>
                    </div>
                  </div>

                  <!-- Alert Type -->
                  <div class="full-width-field">
                    <div class="form-group" id="alertdiv">
                      <label for="alertname" class="control-label">
                        Select Alert Type <b style="color: Red; font-weight: normal;">*</b>
                      </label>
                      <select class="searchable full-control" id="alertname"
                        [(ngModel)]="selectedAlertType" name="alertname">
                        <option value="">Select Alert Type</option>
                        <option value="All">All</option>
                        <option *ngFor="let alert of alertList" [value]="alert.param1">{{alert.param2}}</option>
                      </select>
                    </div>
                  </div>

                  <!-- DATE ROW -->
                  <div class="two-col-row">
                    <div class="two-col">
                      <label for="fromdate" class="control-label">
                        From Date <b style="color:red; font-weight:normal;">*</b>
                      </label>
                      <input class="form-control datepick" type="text" id="fromdate"
                        [(ngModel)]="fromDate" name="fromdate" />
                    </div>

                    <div class="two-col">
                      <label for="todate" class="control-label">
                        To Date <b style="color:red; font-weight:normal;">*</b>
                      </label>
                      <input class="form-control datepick" type="text" id="todate"
                        [(ngModel)]="toDate" name="todate" />
                    </div>
                  </div>

                  <!-- TIME ROW -->
                  <div class="two-col-row">
                    <div class="two-col">
                      <label for="fromtime" class="control-label">
                        From Time <b style="color:red; font-weight:normal;">*</b>
                      </label>
                      <input class="form-control timepicker1" id="fromtime"
                        [(ngModel)]="fromTime" name="fromtime" />
                    </div>

                    <div class="two-col">
                      <label for="totime" class="control-label">
                        To Time <b style="color:red; font-weight:normal;">*</b>
                      </label>
                      <input class="form-control timepicker2" id="totime"
                        [(ngModel)]="toTime" name="totime" />
                    </div>
                  </div>

                  <!-- SEARCH BUTTON -->
                  <div class="search-btn-row">
                    <button class="search-btn-full" type="button" (click)="getSearchActivity()">
                      Search
                    </button>
                  </div>

                </div>
                </div>
                </app-common-data-toolbar>

                <!-- RIGHT PANEL -->
                <div class="right-report-panel">

                  <!-- SUMMARY -->
                  <div class="row" *ngIf="showSummary">
                    <div class="col-md-3"></div>
                    <div class="col-md-6">
                      <table class="table" id="summarytable">
                        <tbody>
                          <tr>
                            <td class="tabledtafont">{{selectName}}</td>
                            <td class="tabledtafont">{{searchValue}}</td>
                          </tr>
                          <tr>
                            <td class="tabledtafont">Vehicle/Chassis No.</td>
                            <td class="tabledtafont">{{searchVelRto}}</td>
                          </tr>
                          <tr>
                            <td class="tabledtafont">Alert Type</td>
                            <td class="tabledtafont">{{searchAlert}}</td>
                          </tr>
                          <tr>
                            <td class="tabledtafont">Date</td>
                            <td class="tabledtafont">{{dateRange}}</td>
                          </tr>
                          <tr>
                            <td class="tabledtafont">Time</td>
                            <td class="tabledtafont">{{timeRange}}</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <app-common-data-toolbar
                    [searchText]="searchText"
                    searchPlaceholder="Type here and press button..."
                    (searchTextChange)="searchText=$event"
                    (search)="getSearchDetails()"
                    (reload)="reloadData()"
                    [loading]="loading"
                    [pageSize]="pageSize"
                    [pageSizeOptions]="pageSizeOptions"
                    [displayedCount]="pageCount"
                    [totalRecords]="totalCount"
                    (pageSizeChange)="onPageSizeChange($event)"
                    [showExcel]="false"
                    pageSizeLabel="Show Rows"
                    totalLabel="Total Records"
                    countSeparator="of">
                  </app-common-data-toolbar>

                  <!-- TABLE -->
                  <ng-template #alertEventCell let-data let-column="column">
                    @if (column.key === 'customerDetails') {
                      {{ data.param27 || 'NA' }}<br>{{ data.param29 || 'NA' }}
                    } @else {
                      {{ alertEventTable.cellValue(data, column) }}
                    }
                  </ng-template>
                  <app-data-table #alertEventTable [columns]="tableColumns" [rows]="getPaginatedData()"
                    [loading]="loading" [sortKey]="sortKey" [reverse]="reverse" [cellTemplate]="alertEventCell"
                    (sortChange)="sort($event)" tableClass="table table-striped app-table" tableId="devicetable"
                    wrapperClass="table-wrapper" emptyMessage="NO DATA FOUND">
                  </app-data-table>

                  <!-- PAGINATION -->
                  <app-pagination [totalCount]="totalCount" [page]="currentPage" [pageSize]="pageSize"
                    [disabled]="loading" (pageChange)="onPageChange($event)">
                  </app-pagination>

                </div>

              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
