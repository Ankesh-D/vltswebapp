<div class="content-i">
  <style>
    .high-alert-row {
    background-color: #ffac3f !important;
  }

  /* Make text bold for highlighted rows for better readability */
  .high-alert-row td {
  font-weight: 700;
}
</style>
<div class="content-box pt-0">
  <div class="element-wrapper">
    <div class="element-box">
      <div class="content-body">
        <div class="container-fluid px-0">
          <div class="card main-card">
            <div class="card-body">
              <div class="col-md-12 pagetitleborder">
                <div class="pagetitlestyle"><span>Vendor Wise Installed Counts Overall Report</span>
              </div>
            </div>
              <app-common-data-toolbar
                [showSearch]="false"
                [showFilters]="true"
                (reload)="reloadData()"
                [loading]="!listLoaded"
                [pageSize]="pageSize"
                [pageSizeOptions]="pageSizeOptions"
                [displayedCount]="detailData.length"
                [totalRecords]="totalCount || 0"
                (pageSizeChange)="onPageSizeChange($event)"
                (excelExport)="downloadExcel()"
                pageSizeLabel="Show Rows"
                totalLabel="Total Records">
                <div toolbarFilters class="d-flex align-items-center gap-2 flex-wrap">
                  <label class="mb-0">Vendor</label>
                  <ng-select class="vendor-select" [items]="vendorlist" bindLabel="param2" bindValue="param1"
                    [(ngModel)]="selectedVendorFilter" (change)="onVendorFilterChange($event)" placeholder="All">
                  </ng-select>
                  <input type="text" id="datepicker" class="form-control" name="date" />
                </div>
                <div toolbarBeforePageSize class="toggle-container modern-toggle mx-2">
                  <button class="toggle-option" [class.active]="vehicleType === 'NEW'"
                    (click)="onChangeVehicleType('NEW')">NEW</button>
                  <button class="toggle-option" [class.active]="vehicleType === 'ALL'"
                    (click)="onChangeVehicleType('ALL')">ALL</button>
                  <button class="toggle-option" [class.active]="vehicleType === 'OLD'"
                    (click)="onChangeVehicleType('OLD')">OLD</button>
                </div>
              </app-common-data-toolbar>
          <!-- "vendorname": "APM KINGSTRACK INDIA PVT LTD",
          "vendorid": "30016",
          "over_speed_count": "8",
          "harsh_brake_count": "0",
          "tempared_count": "0",
          "sos_count": "0",
          "zero_lat_long_count": "46" -->
          <ng-template #installedCountRows let-rows>
            @for (v of rows; track v) {
              <tr [ngClass]="{'high-alert-row': checkAlertCount(v)}">
                <td class="text-end px-2">{{ v.param1 }}</td>
                <td class="text-left px-2">{{ v.param2 }}</td>
                <td class="text-end px-2">{{ v.param3 }}</td>
                <td class="text-end px-2">{{ v.param4 }}</td>
                <td class="text-end px-2">{{ v.param5 }}</td>
                <td class="text-end px-2">{{ v.param6 }}</td>
                <td class="text-end px-2">{{ v.param7 }}</td>
              </tr>
            }
          </ng-template>
          <app-data-table [columns]="tableColumns" [rows]="detailData" [loading]="!listLoaded"
            [emptyMessage]="'NO DATA FOUND'" [bodyTemplate]="installedCountRows"
            tableClass="table table-striped app-table small-table">
          </app-data-table>
          <app-pagination [totalCount]="totalCount || 0" [page]="pageCount" [pageSize]="pageSize"
            [disabled]="!listLoaded" (pageChange)="onPageChange($event)">
          </app-pagination>
            <!-- <div style="display:flex; justify-content: center; margin-top:10px; gap:10px;">

            <button (click)="pageCount = pageCount - 1; getDetails()"
              [disabled]="pageCount === 1">
              Prev
            </button>

            <span style="font-weight:bold;">
              Page {{ pageCount }}
            </span>

            <button (click)="pageCount = pageCount + 1; getDetails()"
              [disabled]="detailData.length < pageSize">
              Next
            </button>

          </div> -->
        </div>
      </div>
    </div>
  </div>
</div>
</div>
</div>
</div>
