<div class="container-fluid py-2">
  <div class="card border-0 shadow-sm">
    <div class="card-body p-2">

      <!-- Home Button (when type is dashboard) -->
      <!-- <button *ngIf="type === 'dashboard'" class="btn btn-sm btn-success btn-sm mb-2" (click)="goHome()">
      <i class="fa fa-angle-double-left me-1"></i> Home
    </button> -->

    <!-- Page Title Row -->
    <div class="d-flex justify-content-between align-items-center border-bottom border-primary py-2 mb-2">
      <div class="pagetitlestyle">Vendor Details</div>
    </div>

    <!-- Search and Pagination Controls -->
    <form autocomplete="off" class="mb-2">
      <div class="d-flex justify-content-between align-items-center flex-wrap">
        <!-- Left Side: Search -->
        <div class="d-flex align-items-center">
          <label class="mb-0 me-2 fw-bold" style="font-size: 11px;">Search :</label>
          <div class="input-group input-group-sm">
            <input type="search" class="form-control shadow-none" placeholder="Type here..."
              [(ngModel)]="searchText" (keyup.enter)="getSearchDetails()" name="searchby" autocomplete="off"
              style="font-size: 11px; width: 200px;">
            <div class="input-group-append">
              <button type="button" class="btn btn-primary" (click)="getSearchDetails()">
                <i class="fa fa-search" style="font-size: 11px;"></i>
              </button>
            </div>
          </div>
          <button type="button" (click)="reloadData()" class="btn btn-outline-success btn-sm ms-2"
            style="font-size: 11px;" title="Reload">
            <i class="fa fa-refresh me-1" [class.fa-spin]="loading"></i>
            {{ loading ? 'Reloading...' : 'Reload' }}
          </button>
        </div>

        <!-- Right Side: Controls -->
        <div class="d-flex align-items-center">
          <!-- Download -->
          <div class="d-flex align-items-center me-3">
            <label class="mb-0 me-2 fw-bold" style="font-size: 11px;">Download :</label>
            <select name="excelpdfdownload" id="excelpdfdownload"
              class="form-control form-control-sm" style="font-size: 11px; width: auto;">
              <option value="Select">Select</option>
              <!-- <option value="Excel">Excel</option> -->
              <option value="">Excel</option>
            </select>
          </div>

          <!-- Show Rows -->
          <div class="d-flex align-items-center me-3">
            <label class="mb-0 me-2 fw-bold" style="font-size: 11px;">Show Rows :</label>
            <select [(ngModel)]="pageSize" (change)="onPageSizeChange(pageSize)" name="pageSize"
              class="form-control form-control-sm" style="font-size: 11px; width: auto;">
              @for (size of pageSizeOptions; track size) {
                <option [value]="size === totalCount ? 'All' : size">
                  {{size === totalCount ? 'All' : size}}
                </option>
              }
            </select>
          </div>

          <!-- Total Records -->
          <span class="fw-bold" style="font-size: 11px;">
            Total Records : <span class="text-primary">{{pageCount}} of {{totalCount}}</span>
          </span>
        </div>
      </div>
    </form>

    <!-- Table -->
    <div class="table-responsive">
      <ng-template #alertRows let-rows>
        @for (vendor of rows; track vendor) {
          <tr>
            <td>{{ vendor.param1 || '-' }}</td>
          </tr>
        }
      </ng-template>
      <app-common-table [columns]="tableColumns" [rows]="vehicleWiseData" [bodyTemplate]="alertRows"
        tableClass="table table-striped app-table table-sm table-bordered" tableId="devicetable"
        emptyMessage="NO DATA FOUND">
      </app-common-table>

      <!-- Pagination Controls -->
      @if (totalCount > 0) {
        <div class="d-flex justify-content-center mt-2 mb-1">
          <ul class="pagination pagination-sm mb-0">
            <li class="page-item" [class.disabled]="currentPage === 1">
              <button class="page-link" (click)="onPageChange(currentPage - 1)" [disabled]="currentPage === 1"
                style="font-size: 11px;">
                <i class="fa fa-angle-left me-1"></i> Prev
              </button>
            </li>
            @for (page of getPageNumbers(); track page) {
              <li class="page-item" [class.active]="currentPage === page">
                @if (page === -1) {
                  <span class="page-link border-0"
                  style="font-size: 11px; color: #6c757d;">...</span>
                }
                @if (page !== -1) {
                  <button class="page-link" (click)="onPageChange(page)"
                    style="font-size: 11px;">
                    {{page}}
                  </button>
                }
              </li>
            }
            <li class="page-item" [class.disabled]="currentPage >= getTotalPages()">
              <button class="page-link" (click)="onPageChange(currentPage + 1)"
                [disabled]="currentPage >= getTotalPages()" style="font-size: 11px;">
                Next <i class="fa fa-angle-right ms-1"></i>
              </button>
            </li>
          </ul>
        </div>
      }
    </div>

  </div>
</div>
</div>
