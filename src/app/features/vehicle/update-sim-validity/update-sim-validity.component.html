<section class="sim-validity-page">
  <app-common-data-toolbar variant="vehicle" searchLabel="Search :" searchPlaceholder="Search ICCID or mobile number"
    [searchText]="searchText" (searchTextChange)="searchText=$event" (search)="getSearchDetails()"
    (reload)="reloadData()" [loading]="loading" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions"
    [displayedCount]="pageCount" [totalRecords]="totalCount" [showExcel]="false" [showFilters]="false"
    (pageSizeChange)="onPageSizeChange($event)" pageSizeLabel="Show Rows" totalLabel="Total Records"
    countSeparator="of">
  </app-common-data-toolbar>

  <ng-template #simValidityBody let-devices>
    @if (devices.length === 0) {
      <tr><td class="no-data" colspan="7">NO DATA FOUND</td></tr>
    }
    @for (device of devices; track device) {
      <tr>
        <td>{{device.param1 || 'NA'}}</td>
        <td>{{device.param7 || 'NA'}}</td>
        <td>{{device.param8 || 'NA'}}<br>{{device.param10 || 'NA'}}</td>
        <td>{{device.param9 || 'NA'}}<br>{{device.param11 || 'NA'}}</td>
        <td>{{device.param50 || 'NA'}}</td>
        <td>{{device.param51 || 'NA'}}</td>
        <td>
          <button type="button" class="btn-table-update" (click)="updateSimValidity(device)"
            [disabled]="isUpdating(device.param1) || loading">
            <i class="fa" [ngClass]="isUpdating(device.param1) ? 'fa-spinner fa-spin' : 'fa-refresh'"
              aria-hidden="true"></i>
            <span>{{isUpdating(device.param1) ? 'Updating...' : 'Update'}}</span>
          </button>
        </td>
      </tr>
    }
  </ng-template>
  <div class="sim-table-scroll">
    <app-data-table [columns]="tableColumns" [rows]="getPaginatedData()" [loading]="loading"
      [sortKey]="sortKey" [reverse]="reverse" [bodyTemplate]="simValidityBody" (sort)="sort($event)"
      tableClass="table table-striped app-table mb-1 sim-validity-table" emptyMessage="NO DATA FOUND">
    </app-data-table>
  </div>
  <div class="pagination-wrapper">
    <app-pagination [totalCount]="totalCount" [page]="currentPage" [pageSize]="pageSize"
      [disabled]="loading" (pageChange)="onPageChange($event)">
    </app-pagination>
  </div>
</section>
