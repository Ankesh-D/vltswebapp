<!-- <div class="content-i"> -->
<div class="row">
  <div class="col-lg-12">
    <!-- <div class="content-box"> -->
    <div class="element-wrapper">
      <div class="element-box">
        <!-- PAGE HEADER -->
        <div class="page-header-row">
          <!-- TITLE -->
          <div class="page-title">Change Dealer</div>

          <!-- ACTION BUTTONS -->
          <div class="header-actions">
            @if (roleId !== '12') {
              <button
                type="button"
                class="add-new-btn"
                routerLink="/device/unassign-distributor"
                >
                Unassign Distributor
              </button>
            }

            <button
              type="button"
              class="add-new-btn"
              routerLink="/device/unassign-dealer"
              >
              <i class="fa fa-minus"></i>
              Unassign Dealer
            </button>

            <button type="button" class="add-new-btn" routerLink="/device/change">
              <i class="fa fa-refresh"></i>
              Change Device
            </button>
          </div>
        </div>

        <div class="table-responsive">
          <app-common-data-toolbar variant="device" searchLabel="Search :" searchPlaceholder="Type here and press button...."
            [showExcel]="false" [showFilters]="false" [searchText]="searchText"
            (searchTextChange)="searchText = $event" (search)="getSearchDetails()" (reload)="reloadData()"
            [loading]="loading" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions"
            [displayedCount]="pageCount" [totalRecords]="totalCount"
            (pageSizeChange)="onPageSizeChange($event)" pageSizeLabel="Show Rows"
            totalLabel="Total Records" countSeparator="of">
          </app-common-data-toolbar>
          <app-data-table [columns]="tableColumns" [rows]="getPaginatedData()" [loading]="loading"
            [sortKey]="sortKey" [reverse]="reverse" tableClass="table table-striped app-table mb-1"
            tableId="devicetable" tableStyle="border-top: 1px solid black; border-bottom: 1px solid black; font-size: 11px;"
            (sort)="sort($event)">
          </app-data-table>
          <div class="float-end">
            <app-pagination [totalCount]="totalCount" [page]="currentPage" [pageSize]="pageSize"
              [disabled]="loading" (pageChange)="onPageChange($event)">
            </app-pagination>
          </div>
        </div>

        <!-- <div class="pagination-wrapper" *ngIf="getTotalPages() > 1">
        <button
          *ngFor="let page of getPageNumbers()"
          (click)="onPageChange(page)"
          [disabled]="page === -1 || currentPage === page"
          [class.active]="currentPage === page"
          >
          <span *ngIf="page === -1">...</span>
          <span *ngIf="page !== -1">{{ page }}</span>
        </button>
      </div> -->
    </div>
  </div>
</div>
</div>
<!-- </div> -->
<!-- </div> -->

<!-- Change Dealer Modal (Angular overlay, legacy style) -->
@if (showChangeModal) {
  <div
    class="modal-overlay change-dealer-modal"
    (click)="back()"
    >
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h5 class="modal-title" style="font-size: 13px">Change Dealer</h5>
        <button type="button" class="close" (click)="back()" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="table-responsive">
          <span style="font-size: 11px"
            >Serial No. : <font>{{ editSerialNo }}</font></span
            ><br />
            <table class="table-bordered table">
              <thead>
                <div class="row">
                  <div class="col-sm-6">
                    <div class="form-group">
                      <label for="" style="font-weight: bold">Dealer Name:</label
                        ><label for="" class="mandetory">*</label>
                        <select
                          id="dealer"
                          [(ngModel)]="selectedDealerPlain"
                          (ngModelChange)="onNewDealerChange($event)"
                          name="newDealer"
                          class="form-control"
                          >
                          <option value="">Dealer Name</option>
                          @for (item of dealerList; track item) {
                            <option
                              [value]="item.param1"
                              >
                              {{ item.param2 }}
                            </option>
                          }
                        </select>
                        <!-- <ng-select id="imeilist" class="form-control"
                        [items]="imeiList"
                        bindLabel="param2"
                        bindValue="param1"
                        placeholder="Select Dealer"
                        [(ngModel)]="selectedDealerPlain"
                        (change)="onNewIMEIChange($event)"
                        name="newIMEI">
                      </ng-select> -->
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <div class="form-group">
                      <label for="" style="font-weight: bold">Remark:</label
                        ><label for="" class="mandetory">*</label>
                        <textarea
                          class="form-control ignorespecialcharacter_address"
                          id="remarks"
                          placeholder="Reason"
                          [(ngModel)]="editRemark"
                          (keyup)="checkRemark()"
                          name="remark"
                    [ngClass]="{
                      'border-danger': isRemarkInvalid,
                      'border-success':
                        !isRemarkInvalid && editRemark.length >= 10,
                    }"
                        ></textarea>
                        @if (isRemarkInvalid) {
                          <div
                            style="color: red; font-size: 11px"
                            >
                            Remark must be at least 10 characters.
                          </div>
                        }
                      </div>
                    </div>
                  </div>
                </thead>
              </table>
            </div>
          </div>
          <div id="updatemodelheaderbutton" class="modelbtnstyle">
            <button
              (click)="changeDealer()"
              [disabled]="isRemarkInvalid || !editNewDealerId || loading"
              >
              {{ loading ? "Changing..." : "Submit" }}
            </button>
            <button id="btnstyle" type="reset" (click)="back()">Back</button>
          </div>
        </div>
      </div>
    }
