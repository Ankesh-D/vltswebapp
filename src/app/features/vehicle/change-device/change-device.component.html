<div class="row">
  <div class="col-lg-12">
    <div class="element-wrapper">
      <div class="element-box">
        <div class="page-header-row">
          <div class="page-title">Change Device</div>
          <div style="display: flex; gap: 10px">
            @if (roleId !== '12') {
              <button type="button" class="add-new-btn" routerLink="/device/unassign-distributor">
                Unassign Distributor
              </button>
            }
            <button type="button" class="add-new-btn" routerLink="/device/unassign-dealer">
              Unassign Dealer
            </button>
            <button type="button" class="add-new-btn" routerLink="/dealer/change">
              Change Dealer
            </button>
          </div>
        </div>

        <app-common-data-toolbar
          variant="device"
          searchLabel="Search :"
          searchPlaceholder="Type here and press button..."
          [searchText]="searchText"
          (searchTextChange)="searchText = $event"
          (search)="getSearchDetails()"
          (reload)="reloadData()"
          [loading]="loading"
          [showFilters]="false"
          [showExcel]="false"
          [showPdf]="false"
          [pageSize]="pageSize"
          [pageSizeOptions]="pageSizeOptions"
          [displayedCount]="pageCount"
          [totalRecords]="totalCount"
          (pageSizeChange)="onPageSizeChange($event)"
          pageSizeLabel="Show Rows"
          totalLabel="Total Records"
          countSeparator="of">
        </app-common-data-toolbar>

        <app-data-table
          [columns]="tableColumns"
          [rows]="tableRows"
          [loading]="loading"
          [sortKey]="sortKey"
          [reverse]="reverse"
          (sort)="sort($event)"
          tableClass="table-striped table app-table mb-1"
          tableStyle="border-top: 1px solid black; border-bottom: 1px solid black; font-size: 11px;"
          emptyMessage="NO DATA FOUND">
        </app-data-table>

        <div class="float-end">
          <app-pagination
            [totalCount]="totalCount"
            [page]="currentPage"
            [pageSize]="pageSize"
            [disabled]="loading"
            (pageChange)="onPageChange($event)">
          </app-pagination>
        </div>
      </div>
    </div>
  </div>
</div>

@if (showChangeModal) {
  <div class="modal-overlay" (click)="back()">
    <div class="modal-content change-device-modal" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h5 class="modal-title">Change Device</h5>
        <button type="button" class="close-btn" (click)="back()">×</button>
      </div>
      <div class="modal-body">
        <div class="serial-info">
          Serial No.: <span>{{ editSerialNo }}</span>
        </div>
        <div class="form-row">
          <div class="form-col">
            <label>IMEI No.<span class="mandetory">*</span></label>
            <ng-select
              [items]="imeiList"
              bindLabel="param2"
              bindValue="param1"
              placeholder="Select IMEI No."
              [(ngModel)]="selectedIMEIPlain"
              (ngModelChange)="onNewIMEIChange($event)"
              name="newIMEI">
            </ng-select>
          </div>
          <div class="form-col">
            <label>Remark<span class="mandetory">*</span></label>
            <textarea
              class="form-control"
              placeholder="Enter remark"
              [(ngModel)]="editRemark"
              (keyup)="checkRemark()"
              [ngClass]="{ 'border-danger': isRemarkInvalid }">
            </textarea>
            @if (isRemarkInvalid) {
              <div class="error-text">
                Remark must be at least 10 characters.
              </div>
            }
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button
          class="btn-primary"
          (click)="changeDevice()"
          [disabled]="isRemarkInvalid || !editNewIMEI || loading">
          {{ loading ? "Changing..." : "Submit" }}
        </button>
        <button class="stn-secondary" (click)="back()">Back</button>
      </div>
    </div>
  </div>
}
