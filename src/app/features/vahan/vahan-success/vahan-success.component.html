<div class="content-i">
  <div class="content-box">
    <div class="row">
      <div class="col-lg-12">
        <div class="element-wrapper">
          <div class="page-header-row">
            <!-- TITLE -->
            <div class="pagetitlestyle">Push To Vahan Success</div>

            <!-- ADD NEW BUTTON -->
            <button
              type="button"
              class="add-new-btn"
              [routerLink]="'/vahan-pending'"
              >
              <i class="fa fa-plus"></i>
              <span>Push To Vahan pending</span>
            </button>
          </div>

          <!-- <div class="table-responsive"> -->
          <div class="col-sm-12">
            <div id="vahanuploadresponseTable">
              <app-common-data-toolbar variant="device" searchLabel="Search :" searchPlaceholder="Type here and press button...."
                [showExcel]="false" [showFilters]="true" [searchText]="searchText"
                (searchTextChange)="searchText = $event" (search)="getSearchDetails()" (reload)="reloadData()"
                [loading]="loading" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions"
                [displayedCount]="pageCount" [totalRecords]="totalCount"
                (pageSizeChange)="onPageSizeChange($event)" pageSizeLabel="Show Rows"
                totalLabel="Total Records" countSeparator="of">
                <div toolbarFilters>
                  <input ngxDaterangepickerMd [(ngModel)]="selectedDateRange" (datesUpdated)="onDateRangeChange($event)"
                    placeholder="Select Date Range" type="text" class="form-control" [maxDate]="maxDate"
                    [drops]="'down'" [locale]="{ format: 'DD-MMM-YYYY' }">
                </div>
              </app-common-data-toolbar>
              <app-data-table [columns]="tableColumns" [rows]="vahanData" [loading]="loading"
                emptyMessage="No Data Found" tableClass="table table-striped app-table mb-1"
                tableStyle="border-top: 1px solid black; border-bottom: 1px solid black;"
                tableId="devicetable" [sortKey]="sortKey" [reverse]="reverse" (sort)="sort($event)">
              </app-data-table>
              <div class="float-end">
                <app-pagination [totalCount]="totalCount" [page]="currentPage" [pageSize]="pageSize"
                  [disabled]="loading" (pageChange)="onPageChange($event)">
                </app-pagination>
              </div>

          <br />
        </div>
      </div>
    </div>
  </div>
</div>
