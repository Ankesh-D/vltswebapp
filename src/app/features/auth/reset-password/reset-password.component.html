

<div class="content-i" style="background: #f8f9fa;">
  <div class="content-box">
    <div class="element-wrapper">
      <div class="element-box">

        <!-- Page Title Restored -->
        <div class="col-md-12 pagetitleborder">
          <div class="pagetitlestyle"><span>Reset Password</span></div>
        </div>

        <!-- Loading and Error Messages moved inside -->
        @if (loading) {
          <app-loading></app-loading>
        }
        @if (errorMessage) {
          <app-error-message [message]="errorMessage"></app-error-message>
        }

        <!-- Card design is now inside the standard layout -->
        <div class="reset-password-container">
          <div class="reset-password-card">
            <div class="card-body-custom">
              <div class="form-desc">
                <i class="fa fa-info-circle"></i>
                <span><strong>NOTE :</strong> Fields marked with <span class="mandetory">*</span> are mandatory.</span>
              </div>

              <div class="row">
                <!-- <div class="col-md-2">&nbsp;</div> -->
                <!-- Role & Login Name on the first row -->
                @if (roleId !='19') {
                  <div class="col-md-3">
                    <div class="form-group">
                      <label for="roleselector">Select Role <span class="mandetory">*</span></label>
                      <ng-select class="custom-ng-select"
                        [items]="roleList" bindLabel="param3"
                        bindValue="param2"
                        placeholder="Select Role" [(ngModel)]="selectedRoleId"
                        (change)="onRoleChange($event)"
                        id="roleselector">
                      </ng-select>
                    </div>
                  </div>
                }
                @if (rtoList.length > 0) {
                  <div class="col-md-3">
                    <div class="form-group">
                      <label>Select {{roleName}} <span class="mandetory">*</span></label>
                      <ng-select class="custom-ng-select" [items]="rtoList" bindLabel="param2" bindValue="param1"
                        placeholder="Select RTO" [(ngModel)]="selectedRtoId" (change)="onRtoChange()">
                      </ng-select>
                    </div>
                  </div>
                }
                <div class="col-md-3" id="adminfieldset">
                  <div class="form-group">
                    <label for="loginname">Select Login Name <span class="mandetory">*</span></label>
                    <ng-select name="loginname" autoComplete="off" class="custom-ng-select" [items]="loginNameList"
                      bindLabel="param2" bindValue="param1" placeholder="Select Login Name"
                      [(ngModel)]="selectedLoginName" (change)="checkFormValid()" id="loginname">
                    </ng-select>
                  </div>
                </div>


                <!-- Old Password -->
                <!-- <div class="col-md-4">
                <div class="form-group">
                  <label for="currpass">Old Password <span class="mandetory">*</span></label>
                  <input class="form-control" id="currpass" maxlength="30"
                    placeholder="Enter Old Password" type="password" [(ngModel)]="oldPassword"
                    (blur)="checkFormValid()" name="oldPassword">
                </div>
              </div> -->

              <!-- New Password -->
              <div class="col-md-3">
                <div class="form-group">
                  <label for="newpass">New Password <span class="mandetory">*</span></label>
                  <div class="password-wrapper">
                    <input class="form-control" id="newpass" placeholder="Enter New Password"
                      [type]="showNewPassword ? 'text' : 'password'" maxlength="30" [(ngModel)]="newPassword"
                      name="newPasswordEnter">
                    <i class="fa toggle-password-icon" [ngClass]="showNewPassword ? 'fa-eye-slash' : 'fa-eye'"
                    (click)="showNewPassword = !showNewPassword"></i>
                  </div>
                  <!-- <div class="validation-message" [ngStyle]="{'color': passwordValid ? '#28a745' : '#dc3545'}" *ngIf="passwordMessage">
                  <i class="fa" [ngClass]="passwordValid ? 'fa-check-circle' : 'fa-exclamation-circle'"></i>
                  {{passwordMessage}}
                </div> -->
              </div>
            </div>

            <!-- Re-enter Password -->
            <div class="col-md-3">
              <div class="form-group">
                <label for="renewpass">Re-Enter Password <span class="mandetory">*</span></label>
                <div class="password-wrapper">
                  <input class="form-control" id="renewpass" autocomplete="off" maxlength="30"
                    placeholder="Re-Enter Password" [type]="showReEnterPassword ? 'text' : 'password'"
                    (keyup)="checkPasswordsMatch()" [(ngModel)]="reEnterPassword" name="reEnterNewPassword">
                  <i class="fa toggle-password-icon" [ngClass]="showReEnterPassword ? 'fa-eye-slash' : 'fa-eye'"
                  (click)="showReEnterPassword = !showReEnterPassword"></i>
                </div>
                @if (changePasswordMessage) {
                  <div class="validation-message" [ngStyle]="{'color': passwordsMatch ? '#28a745' : '#dc3545'}"
                    >
                    <i class="fa" [ngClass]="passwordsMatch ? 'fa-check-circle' : 'fa-exclamation-circle'"></i>
                    {{changePasswordMessage}}
                  </div>
                }
              </div>
            </div>
            <div class="col-md-12">
              <div class="float-end">
                <button class="btn btn-sm btn-secondary mx-2" (click)="resetForm()">
                  <i class="fa fa-undo me-2"></i>
                  Reset
                </button>
                <button class="btn btn-sm btn-primary" (click)="changePassword()">
                  <i class="fa fa-check me-2"></i>
                  Submit
                </button>
              </div>
            </div>
          </div>

          <div class="form-footer">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
</div>


@if (loading) {
  <app-loading></app-loading>
}
@if (errorMessage) {
  <app-toast [message]="errorMessage" type="error" (closed)="errorMessage = null"></app-toast>
}
@if (successMessage) {
  <app-toast [message]="successMessage" type="success"
  (closed)="successMessage = null"></app-toast>
}
