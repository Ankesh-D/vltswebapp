<div class="content-i p-0">
  <div class="content-box">
    <div class="element-wrapper">
      <div class="element-box p-0">
        <div class="col-md-12 pagetitleborder">
          <div class="pagetitlestyle" style="display: flex; justify-content: space-between; align-items: center;">
            <span>Push Command</span>
            <div class="p-1 mt-2">

              @if (showGrid) {
                <button class="btn btn-sm btn-secondary" (click)="resetForm()">Back</button>
              }
            </div>
          </div>
        </div>
        @if (!showGrid) {
          <div>
            <div class="entrypagediv">
              <!-- Command -->
              <div class="form-group">
                <label class="control-label">
                  Device Command <span class="mandetory">*</span>
                </label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Enter Command"
                  [(ngModel)]="deviceCommand"
                  />
              </div>
              <!-- IMEI Section -->
              <div class="form-group">
                <label class="control-label">
                  IMEI Numbers <span class="mandetory">*</span>
                </label>
                <div class="imei-grid">
                  @for (imei of imeiList; track trackByIndex(i, imei); let i = $index) {
                    <div class="imei-item">
                      <input
                        type="text"
                        maxlength="15"
                        class="form-control"
                        placeholder="15 digit IMEI"
                        [(ngModel)]="imeiList[i]"
                        (input)="onImeiInput(i, $event)"
                        (blur)="markTouched(i)"
                        [ngClass]="{'error-input': imeiErrors[i]}"
                        />
                      @if (imeiList.length > 1) {
                        <button
                          type="button"
                          class="btn-delete"
                          (click)="removeImei(i)"
                          >
                          ✖
                        </button>
                      }
                      @if (imeiTouched[i] && imeiErrors[i]) {
                        <div class="error-text">
                          {{ imeiErrors[i] }}
                        </div>
                      }
                    </div>
                  }
                </div>
                <button
                  type="button"
                  class="btn btn-sm btn-success mt-2"
                  (click)="addImei()"
                  [disabled]="imeiList.length >= 100"
                  >
                  + Add More
                </button>
                &nbsp;  &nbsp;
                <button
                  class="btn btn-sm btn-primary mt-2"
                  [disabled]="isLoading"
                  (click)="submit()">
                  @if (isLoading) {
                    <span>Sending...</span>
                  }
                  @if (!isLoading) {
                    <span>Send Command</span>
                  }
                </button>
              </div>
              <!-- Submit -->
              <div class="form-group">
              </div>
            </div>
          </div>
        }
        @if (showGrid) {
          <div class="result-grid">
            <app-data-table
              [columns]="resultColumns"
              [rows]="getSubmittedRows()"
              tableClass="table table-bordered mb-0"
              emptyMessage="NO DATA FOUND">
            </app-data-table>
            <!-- <button class="btn btn-sm btn-secondary" (click)="resetForm()">
            Back
          </button> -->
        </div>
      }


    </div>
  </div>
</div>
</div>
@if (isModalOpen) {
  <div class="modal-backdrop">
    <div class="custom-modal p-0">
      <div class="modal-header d-flex justify-content-between align-items-center p-1">
        <span><b>Raw Data</b></span>
        <button class="close-btn" (click)="isModalOpen = false">✖</button>
      </div>
      <div class="modal-body p-1" style="overflow-x: hidden;">
        <app-common-data-toolbar
          variant="device"
          [showSearch]="false"
          [showFilters]="false"
          [showExcel]="false"
          [showPdf]="false"
          [pageSize]="pageSize"
          [pageSizeOptions]="pageSizeOptions"
          [displayedCount]="rawData.length"
          [totalRecords]="totalCount"
          [loading]="isRawLoading"
          (reload)="reloadData()"
          (pageSizeChange)="onPageSizeChange($event)"
          pageSizeLabel="Show Rows"
          totalLabel="Total Records"
          countSeparator="of">
        </app-common-data-toolbar>
        <div class="table-responsive">
          <app-data-table
            [columns]="rawDataColumns"
            [rows]="rawData"
            [loading]="isRawLoading"
            tableClass="table table-striped app-table mb-0"
            emptyMessage="NO DATA FOUND">
          </app-data-table>
          <div class="float-end">
            <app-pagination
              [totalCount]="totalCount"
              [page]="pageNo"
              [pageSize]="pageSize"
              [disabled]="isRawLoading"
              (pageChange)="onPageChange($event)">
            </app-pagination>
          </div>
        </div>
      </div>
    </div>
  </div>
}
