<div class="container-fluid">
  <!-- ================= Header ================= -->

  <div class="pagetitleborder">
    <div class="page-header-row">
      <div class="pagetitlestyle">RAW DATA DETAILS</div>
    </div>
  </div>

  <app-common-data-toolbar
    variant="device"
    [showSearch]="false"
    [showReload]="false"
    [showFilters]="true"
    [showExcel]="false"
    [showPdf]="false"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    [displayedCount]="pageCount"
    [totalRecords]="totalCount"
    (pageSizeChange)="onPageSizeChange($event)"
    pageSizeLabel="Show"
    totalLabel="Total Records"
    countSeparator="of">
    <div toolbarFilters class="raw-data-filters">
      <label class="filter-field">
        <span class="filter-label">IMEI <span class="req">*</span></span>
        <input
          type="text"
          class="filter-input"
          [(ngModel)]="imei"
          name="imei"
          maxlength="15"
          placeholder="Enter IMEI"
          (keyup.enter)="searchRawData()" />
      </label>

      <label class="filter-field">
        <span class="filter-label">Date <span class="text-danger">*</span></span>
        <input
          type="text"
          class="filter-input"
          ngxDaterangepickerMd
          [(ngModel)]="selectedDate"
          name="selectedDate"
          [singleDatePicker]="true"
          [showDropdowns]="true"
          [autoApply]="true"
          [linkedCalendars]="false"
          [isInvalidDate]="isInvalidDate"
          [locale]="{ format: 'DD-MMM-YYYY' }"
          placeholder="Select Date" />
      </label>

      <button
        type="button"
        class="header-btn search-btn"
        (click)="searchRawData()"
        [disabled]="loading">
        @if (loading) {
          <span class="spinner-border spinner-border-sm"></span>
        }
        Search
      </button>
    </div>
  </app-common-data-toolbar>

  <!-- ================= Packet Tabs ================= -->

  <div class="px-2 pt-1">
    <ul class="nav nav-tabs">
      @for (tab of packetTabs; track tab) {
        <li class="nav-item">
          <a
            class="nav-link"
            href="javascript:void(0)"
            [class.active]="packetType == tab.value"
            (click)="changeTab(tab.value)"
            >
            {{ tab.label }}
          </a>
        </li>
      }
    </ul>
  </div>

  <!-- ================= Table ================= -->

  <div class="table-section">
    <app-data-table
      [columns]="tableColumns"
      [rows]="getPaginatedData()"
      [loading]="loading"
      [sortKey]="sortKey"
      [reverse]="reverse"
      [headerClass]="'rd-thead'"
      [emptyMessage]="'No Data Found'"
      tableClass="table table-striped app-table"
      tableId="rawdatatable"
      (sort)="sort($event)">
    </app-data-table>

    <app-pagination
      [totalCount]="totalCount"
      [page]="currentPage"
      [pageSize]="pageSize"
      [forceDisplay]="totalCount > pageCount || currentPage > 1"
      [disabled]="loading"
      (pageChange)="onPageChange($event)">
    </app-pagination>
  </div>
</div>
