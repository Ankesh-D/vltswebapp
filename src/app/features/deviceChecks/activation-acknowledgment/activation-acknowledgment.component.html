<div style="padding: 10px 10px;">
  <div class="content-box">
    <div class="element-wrapper">
      <div class="element-box">

        <!-- TITLE BAR -->
        <div class="page-header-row">
          <!-- TITLE -->
          <div class="pagetitlestyle">
            Activation Acknowledgement
          </div>
          <div class="modern-nav-group">
            <a class="nav-pill-item pointer"
              style=" z-index: 99 !important;" routerLink="/healthcheck">
              <i class="fa fa-calendar"></i><span>Health Check Acknowledgement</span>
            </a>
            <a class="nav-pill-item pointer active"
              style=" z-index: 99 !important;"  routerLink="/acknowledgeactivation">
              <i class="fa fa-user"></i><span>Activation Acknowlwdgement</span>
            </a>
          </div>
          <!-- <button type="button" class="header-btn" (click)="goToForm()">
          <i class="fa fa-plus"></i> Add New User
        </button> -->

      </div>


      <app-common-data-toolbar variant="device"
        searchLabel="Search :" searchPlaceholder="Type here..."
        [searchText]="detailsRequest.param4"
        (searchTextChange)="detailsRequest.param4=$event"
        (search)="getDetails('search')"
        (reload)="getDetails('init')"
        [loading]="loading" [pageSize]="pageSize"
        [showDateRange]="true"
        [dateRangeStart]="dateRangeStart"
        [dateRangeEnd]="dateRangeEnd"
        (dateRangeChange)="onDateRangeChange($event)"
        [pageSizeOptions]="pageSizeOptions"
        [displayedCount]="pageCount"
        [totalRecords]="totalCount"
        [showExcel]="false"
        (pageSizeChange)="onPageSizeChange($event)"
        pageSizeLabel="Show Rows"
        totalLabel="Total Records"
        countSeparator="of">
      </app-common-data-toolbar>

      <app-data-table
        [columns]="tableColumns"
        [rows]="detailsData"
        [loading]="loading"
        tableClass="table table-striped table-sm table-bordered mb-1"
        tableId="devicetable">
      </app-data-table>

      <div class="float-end">
        <app-pagination
          [totalCount]="totalCount"
          [page]="pageNo"
          [pageSize]="pageSize"
          (pageChange)="onPageChange($event)">
        </app-pagination>
      </div>
    </div>
  </div>
</div>
</div>
