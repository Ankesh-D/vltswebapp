<div style="padding: 10px 10px;">
  <div class="content-box">
    <div class="element-wrapper">
      <div class="element-box">

        <!-- TITLE BAR -->
        <div class="page-header-row">
          <!-- TITLE -->
          <div class="pagetitlestyle">
            User Details
          </div>
          <button type="button" class="header-btn" (click)="goToForm()">
            <i class="fa fa-plus"></i> Add New User
          </button>

        </div>


        <!-- SEARCH + CONTROLS BAR -->
        <div class="top-controls-row">

          <!-- LEFT SEARCH -->
          <div class="left-controls">

            <!-- SEARCH WITH INNER BUTTON -->
            <div class="search-box">
              <input type="search" class="search-input inner" placeholder="Type here and press button...."
                maxlength="50" [(ngModel)]="detailsRequest.param1" (keyup.enter)="getDetails('search')"
                name="searchTextBox" />

              <button type="button" class="search-inner-btn" (click)="getDetails('search')">
                <i class="fa fa-search"></i>
              </button>
            </div>

            <!-- RELOAD -->
            <button (click)="getDetails('init')" [disabled]="loading"
              style="margin-left: 10px; background: #fff; border: 1px solid #0b58b9; color: #0b58b9; border-radius: 4px; height: 26px; padding: 0 12px; font-size: 11px; cursor: pointer; display: flex; align-items: center; font-weight: bold;">
              <i class="fa fa-refresh" [class.fa-spin]="loading" style="margin-right: 5px;"></i>
              <span>{{ loading ? 'Reloading...' : 'Reload' }}</span>
            </button>

          </div>

          <!-- RIGHT CONTROLS -->
          <div class="right-controls">
            <!-- <div style="display: flex; align-items: center; margin-right: 15px;">
            <label class="total-records-text">
              Download: &nbsp;
            </label>

            <select [(ngModel)]="selectedDownloadType" (change)="onDownloadChange()"
              [disabled]="isExporting"
              style="height: 24px; border: 1px solid #0b58b9; border-radius: 4px; font-size: 11px; padding: 0 5px; background: white;">

              <option value="" selected>Select</option>
              <option value="Excel">Excel</option>
            </select>

            <span *ngIf="isExporting" style="margin-left:8px; font-size:11px; color:#0b58b9;">
              <i class="fa fa-spinner fa-spin"></i> Generating...
            </span>
          </div> -->
          <select class="rows-select" [(ngModel)]="detailsRequest.param3" (change)="getDetails('pageSize')">
            @for (size of pageSizeOptions; track size) {
              <option [value]="size === totalCount ? totalCount : size">
                {{size === totalCount ? totalCount : size}}
              </option>
            }
          </select>

          <div class="total-records-text">
            Total Records : {{ pageCount }} of {{ totalCount }}
          </div>

        </div>
      </div>

      <!-- TABLE -->
      <app-common-table [columns]="tableColumns" [rows]="detailsData" [loading]="loading"
        tableClass="table table-striped app-table" tableId="devicetable" emptyMessage="No Record Found">
      </app-common-table>
      <div class="float-end">
          @if (totalCount > pageSize) {
            <ngb-pagination [collectionSize]="totalCount" [(page)]="detailsRequest.param2"
              [pageSize]="pageSize" (pageChange)="onPageChange($event)" [maxSize]="5" [rotate]="true"
              [ellipses]="false" [boundaryLinks]="true" size="sm" class="d-flex justify-content-center mt-2 mb-1">
            </ngb-pagination>
          }
        </div>

    </div>
  </div>
  </div>
</div>
