<div style="padding: 10px 10px;">
  <div class="content-box">
    <div class="element-wrapper">
      <div class="element-box">
        <div class="page-header-row">
          <div class="pagetitlestyle">User Details</div>
          <button type="button" class="header-btn" (click)="goToForm()">
            <i class="fa fa-plus"></i> Add New User
          </button>
        </div>

        <app-common-data-toolbar
          variant="device"
          searchLabel="Search"
          searchPlaceholder="Type here and press button..."
          [searchText]="detailsRequest.param1"
          (searchTextChange)="detailsRequest.param1 = $event"
          (search)="getDetails('search')"
          (reload)="getDetails('init')"
          [loading]="loading"
          [showFilters]="false"
          [showExcel]="false"
          [showPdf]="false"
          pageSizeLabel="Show Rows"
          totalLabel="Total Records"
          countSeparator="of"
          [pageSize]="pageSize"
          [pageSizeOptions]="pageSizeOptions"
          [displayedCount]="pageCount"
          [totalRecords]="totalCount"
          (pageSizeChange)="onPageSizeChange($event)">
        </app-common-data-toolbar>

        <app-data-table
          [columns]="tableColumns"
          [rows]="detailsData"
          [loading]="loading"
          tableClass="table table-striped app-table"
          tableId="devicetable"
          emptyMessage="No Record Found">
        </app-data-table>

        <app-pagination
          [totalCount]="totalCount"
          [page]="detailsRequest.param2"
          [pageSize]="pageSize"
          [disabled]="loading"
          (pageChange)="onPageChange($event)">
        </app-pagination>
      </div>
    </div>
  </div>
</div>
